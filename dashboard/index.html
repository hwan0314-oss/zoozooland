<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쥬쥬랜드 경영 실적 대시보드</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-full flex flex-col overflow-hidden selection:bg-indigo-100 selection:text-indigo-900">

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="bg-slate-900 text-white shrink-0 shadow-md z-20">
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-500 rounded-lg flex items-center justify-center shadow-inner">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">쥬쥬랜드 실적 리포트</h1>
                    <p class="text-xs text-slate-400 mt-0.5">임원진 보고용 대시보드</p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm text-slate-300">
                <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span id="generatedAt">데이터 로딩 중...</span>
                </div>
                <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 transition-colors px-4 py-2 rounded-lg text-white font-medium flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    리포트 다운로드
                </button>
            </div>
        </div>
    </header>

    <!-- ── Main ────────────────────────────────────────────────── -->
    <main class="flex-1 overflow-y-auto p-6 space-y-6">

        <!-- Top row: date/weather + KPI cards -->
        <div class="flex gap-6">

            <!-- Date / Weather (1/3) -->
            <div class="w-1/3 flex flex-col gap-3">
                <!-- Today -->
                <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="inline-block px-2 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded mb-2">오늘 (당일)</span>
                            <div id="todayDate" class="text-lg font-bold text-slate-900 tracking-tight">--</div>
                        </div>
                        <div class="flex items-center gap-3 text-right">
                            <div id="todayWeatherIcon" class="w-10 h-10 rounded-full flex items-center justify-center"></div>
                            <div>
                                <div id="todayWeatherDesc" class="font-bold text-slate-800">--</div>
                                <div id="todayWeatherTemp" class="text-sm text-slate-500 tabular-nums">-- / --°</div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Last year -->
                <div class="bg-slate-100/50 rounded-xl p-4 border border-slate-200 border-dashed relative overflow-hidden opacity-90">
                    <div class="absolute top-0 left-0 w-1 h-full bg-slate-300"></div>
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="inline-block px-2 py-1 bg-slate-200 text-slate-600 text-xs font-bold rounded mb-2">작년 (동일)</span>
                            <div id="prevDate" class="text-lg font-bold text-slate-600 tracking-tight">--</div>
                        </div>
                        <div class="flex items-center gap-3 text-right">
                            <div id="prevWeatherIcon" class="w-10 h-10 rounded-full flex items-center justify-center"></div>
                            <div>
                                <div id="prevWeatherDesc" class="font-bold text-slate-600">--</div>
                                <div id="prevWeatherTemp" class="text-sm text-slate-400 tabular-nums">-- / --°</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- KPI cards (2/3) -->
            <div class="w-2/3 grid grid-cols-3 gap-4">

                <!-- Daily sales -->
                <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex justify-between items-start">
                        <div class="text-sm font-semibold text-slate-500">일일 전체매출</div>
                        <div class="p-2 bg-blue-50 rounded-lg text-blue-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h20"/><path d="M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8"/><path d="M4 6v-2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/><path d="M12 12v6"/></svg>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1 mt-2">
                            <span id="kpiDailySales" class="text-2xl font-extrabold tracking-tight tabular-nums text-slate-900">--</span>
                            <span class="text-sm text-slate-500 font-medium">원</span>
                        </div>
                        <div id="kpiDailySalesYoy" class="mt-2 flex items-center gap-1.5 text-sm font-semibold"></div>
                    </div>
                </div>

                <!-- Daily visitors -->
                <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div class="flex justify-between items-start">
                        <div class="text-sm font-semibold text-slate-500">일일 총 입장객</div>
                        <div class="p-2 bg-indigo-50 rounded-lg text-indigo-600">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-baseline gap-1 mt-2">
                            <span id="kpiDailyVisitors" class="text-2xl font-extrabold tracking-tight tabular-nums text-slate-900">--</span>
                            <span class="text-sm text-slate-500 font-medium">명</span>
                        </div>
                        <div id="kpiDailyVisitorsYoy" class="mt-2 flex items-center gap-1.5 text-sm font-semibold"></div>
                    </div>
                </div>

                <!-- YTD sales (dark card) -->
                <div class="bg-slate-900 rounded-xl p-5 border border-slate-800 shadow-lg flex flex-col justify-between text-white relative overflow-hidden">
                    <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white/5 blur-2xl"></div>
                    <div class="flex justify-between items-start relative z-10">
                        <div class="text-sm font-semibold text-slate-300">연누계 전체매출 (YTD)</div>
                        <div class="p-2 bg-white/10 rounded-lg text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                        </div>
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-baseline gap-1 mt-2">
                            <span id="kpiYtdSales" class="text-2xl font-extrabold tracking-tight tabular-nums">--</span>
                            <span class="text-sm text-slate-400 font-medium">원</span>
                        </div>
                        <div id="kpiYtdSalesYoy" class="mt-2 flex items-center gap-1.5 text-sm font-semibold"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Detail table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 bg-white flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                    상세 실적 현황표
                </h2>
                <div class="text-xs text-slate-500 flex items-center gap-4">
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-emerald-100 border border-emerald-200 block"></span> 성장 (전년비 +)</div>
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-rose-100 border border-rose-200 block"></span> 감소 (전년비 -)</div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left border-collapse min-w-[900px]">
                    <thead class="text-xs bg-slate-50 sticky top-0 z-20">
                        <tr>
                            <th rowspan="2" class="px-6 py-4 border-b-2 border-r border-slate-300 bg-slate-100 font-bold text-slate-700 text-center sticky left-0 z-30 shadow-[1px_0_0_0_#cbd5e1]">구분</th>
                            <th colspan="2" class="px-6 py-3 border-b border-r border-slate-200 bg-blue-50/50 text-blue-800 font-bold text-center">일별 (Daily)</th>
                            <th colspan="2" class="px-6 py-3 border-b border-r border-slate-200 bg-indigo-50/50 text-indigo-800 font-bold text-center">월누계 (Monthly)</th>
                            <th colspan="2" class="px-6 py-3 border-b border-slate-200 bg-violet-50/50 text-violet-800 font-bold text-center">연누계 (YTD)</th>
                        </tr>
                        <tr class="text-slate-600">
                            <th class="px-4 py-2 border-b-2 border-r border-slate-300 bg-white font-semibold text-right w-32">금액/수량</th>
                            <th class="px-4 py-2 border-b-2 border-r border-slate-300 bg-white font-semibold text-center w-24">전년비</th>
                            <th class="px-4 py-2 border-b-2 border-r border-slate-300 bg-white font-semibold text-right w-32">금액/수량</th>
                            <th class="px-4 py-2 border-b-2 border-r border-slate-300 bg-white font-semibold text-center w-24">전년비</th>
                            <th class="px-4 py-2 border-b-2 border-r border-slate-300 bg-white font-semibold text-right w-36">금액/수량</th>
                            <th class="px-4 py-2 border-b-2 border-slate-300 bg-white font-semibold text-center w-24">전년비</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200 tabular-nums">
                        <tr><td colspan="7" class="px-6 py-8 text-center text-slate-400">데이터 로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 text-xs text-slate-500 flex justify-between items-center">
                <p>* N/A: 전년도 데이터 없음 또는 비교 불가 항목</p>
                <p>단위: 명, 원 / VAT 포함 기준</p>
            </div>
        </div>
    </main>

    <script>
    // ── Weather icons ────────────────────────────────────────────────────
    const WEATHER_ICONS = {
        sunny: `<div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-orange-500"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>`,
        rainy:  `<div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-500"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg></div>`,
        snowy:  `<div class="w-10 h-10 rounded-full bg-sky-50 flex items-center justify-center text-sky-400"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/></svg></div>`,
        thunder:`<div class="w-10 h-10 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-500"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/></svg></div>`,
        cloudy: `<div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg></div>`,
    };

    function getWeatherIcon(desc) {
        if (!desc) return WEATHER_ICONS.sunny;
        if (['맑음','대체로맑음'].includes(desc))                 return WEATHER_ICONS.sunny;
        if (['비','이슬비','소나기','강한비'].includes(desc))      return WEATHER_ICONS.rainy;
        if (['눈','강한눈'].includes(desc))                       return WEATHER_ICONS.snowy;
        if (['뇌우'].includes(desc))                              return WEATHER_ICONS.thunder;
        return WEATHER_ICONS.cloudy;
    }

    // ── YOY badge ────────────────────────────────────────────────────────
    const UP = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>`;
    const DN = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;

    function yoyBadge(yoy, dark = false) {
        if (!yoy || yoy === 'N/A')
            return `<span class="text-slate-400">N/A</span>`;
        if (yoy.startsWith('+'))
            return dark
                ? `<div class="bg-emerald-500/20 p-0.5 rounded-full text-emerald-400">${UP}</div><span class="text-emerald-400">${yoy}</span>`
                : `<div class="bg-emerald-100 p-0.5 rounded-full text-emerald-600">${UP}</div><span class="text-emerald-600">${yoy}</span>`;
        if (yoy.startsWith('-'))
            return dark
                ? `<div class="bg-rose-500/20 p-0.5 rounded-full text-rose-400">${DN}</div><span class="text-rose-400">${yoy}</span>`
                : `<div class="bg-rose-100 p-0.5 rounded-full text-rose-600">${DN}</div><span class="text-rose-600">${yoy}</span>`;
        return `<span class="text-slate-500">${yoy}</span>`;
    }

    function yoyCell(yoy, dark = false) {
        return `<div class="flex items-center justify-center gap-1.5 font-semibold">${yoyBadge(yoy, dark)}</div>`;
    }

    // ── Table row builders ───────────────────────────────────────────────
    function makeRow(row, idx) {
        if (row.separator)
            return `<tr><td colspan="7" class="h-1 bg-slate-100"></td></tr>`;

        const label = (row.label || '').trim();
        const d = row.d || {}, m = row.m || {}, y = row.y || {};

        // Grand total row
        if (row.grand_total) return `
            <tr class="bg-slate-800 text-white border-t border-slate-700">
                <td class="px-6 py-4 border-r border-slate-700 sticky left-0 bg-slate-800 font-extrabold text-lg shadow-[1px_0_0_0_#334155]">${label}</td>
                <td class="px-4 py-4 text-right border-r border-slate-700 font-extrabold">${d.val||'--'}</td>
                <td class="px-4 py-4 border-r border-slate-700">${yoyCell(d.yoy, true)}</td>
                <td class="px-4 py-4 text-right border-r border-slate-700 font-extrabold">${m.val||'--'}</td>
                <td class="px-4 py-4 border-r border-slate-700">${yoyCell(m.yoy, true)}</td>
                <td class="px-4 py-4 text-right border-r border-slate-700 font-extrabold text-indigo-200">${y.val||'--'}</td>
                <td class="px-4 py-4">${yoyCell(y.yoy, true)}</td>
            </tr>`;

        // Subtotal row
        if (row.subtotal) return `
            <tr class="bg-indigo-50/60 border-t-2 border-slate-300">
                <td class="px-6 py-3.5 border-r border-slate-300 sticky left-0 bg-indigo-50/90 font-bold text-indigo-900 shadow-[1px_0_0_0_#cbd5e1]">${label}</td>
                <td class="px-4 py-3.5 text-right border-r border-slate-300 font-bold text-slate-900">${d.val||'--'}</td>
                <td class="px-4 py-3.5 border-r border-slate-300 font-bold">${yoyCell(d.yoy)}</td>
                <td class="px-4 py-3.5 text-right border-r border-slate-300 font-bold text-slate-900">${m.val||'--'}</td>
                <td class="px-4 py-3.5 border-r border-slate-300 font-bold">${yoyCell(m.yoy)}</td>
                <td class="px-4 py-3.5 text-right border-r border-slate-300 font-bold text-slate-900">${y.val||'--'}</td>
                <td class="px-4 py-3.5 font-bold">${yoyCell(y.yoy)}</td>
            </tr>`;

        // Header / indent / normal row
        const even = idx % 2 === 0;
        const bg   = row.header ? 'bg-slate-50/50' : (even ? '' : 'bg-slate-50/40');
        const stickyBg = row.header ? 'bg-slate-50' : (even ? 'bg-white' : 'bg-slate-50/80');

        const labelTd = row.indent
            ? `<td class="px-6 py-3 border-r border-slate-200 sticky left-0 ${stickyBg} text-slate-600 shadow-[1px_0_0_0_#e2e8f0]"><span class="inline-flex items-center gap-2 pl-4"><span class="w-1.5 h-1.5 rounded-full bg-slate-300 shrink-0"></span>${label}</span></td>`
            : `<td class="px-6 py-3 border-r border-slate-200 sticky left-0 ${stickyBg} ${row.header ? 'font-bold text-slate-800' : 'font-medium text-slate-800'} shadow-[1px_0_0_0_#e2e8f0]">${label}</td>`;

        return `
        <tr class="hover:bg-slate-50 transition-colors ${bg}">
            ${labelTd}
            <td class="px-4 py-3 text-right border-r border-slate-200 ${row.header ? 'font-semibold' : ''}">${d.val||'--'}</td>
            <td class="px-4 py-3 border-r border-slate-200">${yoyCell(d.yoy)}</td>
            <td class="px-4 py-3 text-right border-r border-slate-200 ${row.header ? 'font-semibold' : ''}">${m.val||'--'}</td>
            <td class="px-4 py-3 border-r border-slate-200">${yoyCell(m.yoy)}</td>
            <td class="px-4 py-3 text-right border-r border-slate-200 ${row.header ? 'font-semibold' : ''}">${y.val||'--'}</td>
            <td class="px-4 py-3">${yoyCell(y.yoy)}</td>
        </tr>`;
    }

    // ── Render all ───────────────────────────────────────────────────────
    function render(data) {
        // Dates
        document.getElementById('todayDate').textContent = data.today_date || '--';
        document.getElementById('prevDate').textContent  = data.prev_date  || '--';

        // Weather
        const tw = data.today_weather || {}, pw = data.prev_weather || {};
        document.getElementById('todayWeatherIcon').innerHTML = getWeatherIcon(tw.desc);
        document.getElementById('prevWeatherIcon').innerHTML  = getWeatherIcon(pw.desc);
        document.getElementById('todayWeatherDesc').textContent = tw.desc || '--';
        document.getElementById('prevWeatherDesc').textContent  = pw.desc || '--';
        document.getElementById('todayWeatherTemp').textContent = tw.tmax ? `${tw.tmax}° / ${tw.tmin}°` : '--';
        document.getElementById('prevWeatherTemp').textContent  = pw.tmax ? `${pw.tmax}° / ${pw.tmin}°` : '--';

        // KPI
        const kpi = data.kpi || {};
        document.getElementById('kpiDailySales').textContent    = kpi.daily_sales    || '--';
        document.getElementById('kpiDailyVisitors').textContent = kpi.daily_visitors || '--';
        document.getElementById('kpiYtdSales').textContent      = kpi.ytd_sales      || '--';
        document.getElementById('kpiDailySalesYoy').innerHTML    = yoyBadge(kpi.daily_sales_yoy)    + `<span class="text-slate-400 font-normal text-xs ml-1">vs 전년</span>`;
        document.getElementById('kpiDailyVisitorsYoy').innerHTML = yoyBadge(kpi.daily_visitors_yoy) + `<span class="text-slate-400 font-normal text-xs ml-1">vs 전년</span>`;
        document.getElementById('kpiYtdSalesYoy').innerHTML      = yoyBadge(kpi.ytd_sales_yoy, true) + `<span class="text-slate-400 font-normal text-xs ml-1">vs 전년</span>`;

        // Generated at
        document.getElementById('generatedAt').textContent = data.generated_at || '데이터 연동 중';

        // Table rows
        const rows = data.rows || [];
        let dataIdx = 0;
        const html = rows.map(row => {
            const out = makeRow(row, row.separator ? 0 : dataIdx);
            if (!row.separator) dataIdx++;
            return out;
        }).join('');
        document.getElementById('tableBody').innerHTML = html ||
            '<tr><td colspan="7" class="px-6 py-8 text-center text-slate-400">데이터 없음</td></tr>';
    }

    // ── Fetch & auto-refresh ─────────────────────────────────────────────
    async function loadData() {
        try {
            const res = await fetch('report_data.json?' + Date.now());
            if (!res.ok) throw new Error(res.status);
            render(await res.json());
        } catch (e) {
            document.getElementById('generatedAt').textContent = '로딩 실패 (' + e.message + ')';
            document.getElementById('tableBody').innerHTML =
                `<tr><td colspan="7" class="px-6 py-8 text-center text-rose-400">
                    report_data.json 로드 실패 — GitHub Actions 실행 후 새로고침 해주세요.
                </td></tr>`;
        }
    }

    loadData();
    setInterval(loadData, 10 * 60 * 1000);
    </script>

</body>
</html>
