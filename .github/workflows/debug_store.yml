name: Debug - Store API Explorer

on:
  workflow_dispatch:

jobs:
  explore:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Explore store API
        env:
          KIS_ID: ${{ secrets.KIS_ID }}
          KIS_PW: ${{ secrets.KIS_PW }}
        run: python debug_store_api.py
