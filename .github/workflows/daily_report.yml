name: Daily Report - Zoozooland

on:
  # 발송 시간은 cron-job.org(console.cron-job.org, "쥬쥬랜드 실적 리포트")에서 관리:
  # 매일 14:00·18:00 KST에 이 워크플로를 dispatch (GitHub PAT: zoozooland-action)
  # 휴무일(당일·전년 동일요일 실적 모두 0)은 report.py가 발송 생략
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # dashboard/report_data.json 자동 커밋에 필요
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean fonts
        run: sudo apt-get install -y fonts-nanum

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          KIS_ID: ${{ secrets.KIS_ID }}
          KIS_PW: ${{ secrets.KIS_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python report.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/report_data.json
          git diff --cached --quiet || git commit -m "chore: update dashboard data $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push
