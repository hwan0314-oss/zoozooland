name: Daily Report - Zoozooland

on:
  workflow_dispatch:  # Claude 스케줄러가 매일 19:00 KST에 트리거

jobs:
  report:
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # dashboard/report_data.json 자동 커밋에 필요
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean fonts
        run: sudo apt-get install -y fonts-nanum

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report
        env:
          KIS_ID: ${{ secrets.KIS_ID }}
          KIS_PW: ${{ secrets.KIS_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python report.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/report_data.json
          git diff --cached --quiet || git commit -m "chore: update dashboard data $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
          git push
