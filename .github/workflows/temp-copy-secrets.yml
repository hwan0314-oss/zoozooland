name: TEMP copy secrets to zzl-collectors
# 한 번만 쓰고 지운다: 실적·마케팅 수집 Secrets 10개를 비공개 저장소 zzl-collectors 로 복사 (값은 로그에 나오지 않음)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.COLLECTORS_SETUP_PAT }}
          KIS_ID: ${{ secrets.KIS_ID }}
          KIS_PW: ${{ secrets.KIS_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
        run: |
          set -euo pipefail
          for n in KIS_ID KIS_PW TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID KMA_API_KEY GA4_SERVICE_ACCOUNT_JSON GA4_PROPERTY_ID GSC_SITE_URL CLARITY_PROJECT_ID CLARITY_API_TOKEN; do
            if [ -z "${!n:-}" ]; then echo "missing $n"; exit 1; fi
            printf '%s' "${!n}" | gh secret set "$n" --repo hwan0314-oss/zzl-collectors
          done