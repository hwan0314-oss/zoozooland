name: 🌐 Deploy ZZL (zoozoo.kr)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-zzl/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ZZL to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment
        run: |
          mkdir -p deploy/js

          # 1. ZZL이 메인 사이트 (루트)
          cp -r website-zzl/. deploy/

          # 2. 공유 데이터 & 이미지 (website/에서 관리)
          cp -r website/data  deploy/data
          cp -r website/images deploy/images

          # 3. zoozoo.kr 커스텀 도메인
          echo "zoozoo.kr" > deploy/CNAME

          # 3. 관리자 패널 (website/admin/ + website/js/dashboard.js)
          cp -r website/admin deploy/admin
          cp website/js/dashboard.js deploy/js/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install --quiet pillow

      - name: Build static HTML (SSG for SEO + WebP images)
        run: python3 website-zzl/build.py

      - name: Build Tailwind CSS
        run: |
          npx --yes tailwindcss@3.4.17 \
            -c website-zzl/tailwind.config.js \
            -i website-zzl/css/tailwind.src.css \
            -o deploy/css/tailwind.css --minify
          rm -f deploy/css/tailwind.src.css deploy/tailwind.config.js deploy/build.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
