name: 🌐 Deploy Website (zoozoo.kr)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-zzl/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare combined deployment
        run: |
          mkdir -p deploy/zzl
          cp -r website/. deploy/
          cp -r website-zzl/. deploy/zzl/
          cp -r website/data deploy/zzl/data
          cp -r website/images deploy/zzl/images

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
