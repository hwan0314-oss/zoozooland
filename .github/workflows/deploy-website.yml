name: 🌐 Deploy ZZL (zoozoo.kr)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'website-zzl/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy ZZL to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment
        run: |
          mkdir -p deploy/js

          # 1. ZZL이 메인 사이트 (루트)
          cp -r website-zzl/. deploy/

          # 2. 공유 데이터 & 이미지 (website/에서 관리)
          cp -r website/data  deploy/data
          cp -r website/images deploy/images

          # 3. zoozoo.kr 커스텀 도메인
          echo "zoozoo.kr" > deploy/CNAME

          # 3. 관리자 패널 (website/admin/ + website/js/admin.js)
          cp -r website/admin deploy/admin
          cp website/js/admin.js deploy/js/admin.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
