<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>ZZL 가이드맵 — 쥬쥬랜드</title>
  <meta name="description" content="쥬쥬랜드 가이드맵. 동물 관람 구역, 편의시설, 프로그램 안내.">
  <meta property="og:title" content="ZZL 가이드맵">
  <meta property="og:description" content="쥬쥬랜드 현장 가이드맵">
  <meta property="og:image" content="https://zoozoo.kr/images/guidemap.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #0A0B0A; color: #fff; font-family: 'Inter', sans-serif; }
    body { min-height: 100dvh; display: flex; flex-direction: column; }

    /* ── 상단 헤더 ── */
    header {
      position: relative; z-index: 50; flex-shrink: 0;
      background: rgba(10,11,10,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 56px;
    }
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 900; font-size: 1rem; letter-spacing: 0.05em;
      color: #fff; text-decoration: none;
    }
    .logo span { color: #D4FF00; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-dl {
      background: #D4FF00; color: #0A0B0A;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em;
      padding: 8px 16px; text-decoration: none; transition: filter 0.2s;
    }
    .btn-dl:hover { filter: brightness(1.1); }
    .btn-home {
      color: rgba(255,255,255,0.4);
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      text-transform: uppercase; letter-spacing: 0.08em;
      text-decoration: none; transition: color 0.2s;
    }
    .btn-home:hover { color: #D4FF00; }

    /* ── GPS 상태 바 ── */
    .gps-bar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 7px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.12em;
      background: rgba(10,11,10,0.7);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: border-color 0.4s;
    }
    .gps-bar-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
      transition: background 0.4s;
    }
    .gps-bar.finding  .gps-bar-dot { background: rgba(255,255,255,0.25); }
    .gps-bar.found    .gps-bar-dot { background: #D4FF00; animation: dot-blink 2.4s ease-in-out infinite; }
    .gps-bar.outside  .gps-bar-dot { background: rgba(255,200,0,0.7); }
    .gps-bar.error    .gps-bar-dot { background: rgba(255,80,80,0.7); }
    .gps-bar.found    { border-bottom-color: rgba(212,255,0,0.15); }
    #gpsBarText { color: rgba(255,255,255,0.4); transition: color 0.4s; }
    .gps-bar.found #gpsBarText { color: rgba(212,255,0,0.6); }
    @keyframes dot-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* ── 맵 뷰어 ── */
    .map-viewer {
      flex: 1;
    }
    .map-wrap {
      position: relative;
      display: block;
      width: 100%;
      line-height: 0;
    }
    .map-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none; -webkit-user-drag: none;
    }

    /* GPS 정확도 원 (canvas) */
    .gps-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* GPS 위치 점 (CSS 애니메이션) */
    .gps-dot {
      position: absolute;
      width: 22px; height: 22px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
    .gps-dot::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #D4FF00;
      border: 2.5px solid #fff;
      box-shadow: 0 0 8px rgba(212,255,0,0.6);
    }
    .gps-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(212,255,0,0.5);
      animation: gps-ring 2s cubic-bezier(0,0,0.2,1) infinite;
    }
    @keyframes gps-ring {
      0%   { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    /* ── 하단 바 ── */
    footer {
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 12px 20px; height: 44px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-info { color: rgba(255,255,255,0.2); font-size: 0.5rem; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; }
    .footer-tel { color: rgba(255,255,255,0.4); font-size: 0.55rem; font-family: 'JetBrains Mono', monospace; text-decoration: none; transition: color 0.2s; }
    .footer-tel:hover { color: #D4FF00; }
  </style>
</head>
<body>

<header>
  <a href="/" class="logo"><span>ZZL</span> 쥬쥬랜드</a>
  <div class="header-right">
    <a href="/" class="btn-home">← 홈</a>
    <a href="images/guidemap.pdf" download="ZZL_가이드맵.pdf" class="btn-dl">PDF 저장</a>
  </div>
</header>

<div class="gps-bar finding" id="gpsBar">
  <span class="gps-bar-dot"></span>
  <span id="gpsBarText">내 위치 찾는 중...</span>
</div>

<div class="map-viewer">
  <div class="map-wrap" id="mapWrap">
    <img src="images/guidemap.png" alt="ZZL 쥬쥬랜드 가이드맵" class="map-img" id="mapImg">
    <canvas class="gps-canvas" id="gpsCanvas"></canvas>
    <div class="gps-dot" id="gpsDot"></div>
  </div>
</div>

<footer>
  <span class="footer-info">ZZL_MAP · zoozoo.kr/map</span>
  <a href="tel:031-962-4500" class="footer-tel">031-962-4500</a>
</footer>

<script>
// ── GCP 데이터 ──────────────────────────────────────────────────────────────
// [경도(lng), 위도(lat), 픽셀X, 픽셀Y]  ← 이미지 원본 크기: 4492 × 3176
// 픽셀 좌표는 gcp-tool.html 측정값으로 업데이트 필요 (현재는 초기 추정값)
const GCPs = [
  [126.8538597, 37.6903466, 2487, 2054],  // 01. 입구(매표소) 아래
  [126.8540339, 37.6902809, 2510, 1839],  // 02. 입구(매표소) 위
  [126.8535053, 37.6898443, 3273, 2218],  // 03. 주차장 오른쪽 아래
  [126.8543281, 37.689641,  3258, 1219],  // 04. 주차장 오른쪽 위
  [126.8537643, 37.6902084, 2694, 2096],  // 05. 주차장 왼쪽 아래
  [126.8541615, 37.690084,  2718, 1637],  // 06. 식당 왼쪽 아래
  [126.8543509, 37.6899381, 2838, 1380],  // 07. 식당 오른쪽 위
  [126.8549816, 37.6897766, 2835,  664],  // 08. 1번 파충류관 오른쪽 아래
  [126.8553769, 37.6901253, 2232,  423],  // 09. 1번 파충류관 왼쪽 위
  [126.8547496, 37.6905664, 1888, 1249],  // 10. 4번 악어 빌리지 중심
  [126.8551222, 37.6908717, 1372, 1004],  // 11. 6번 로봇박물관 중심
  [126.8546258, 37.6911832, 1159, 1622],  // 12. 9번 건물 오른쪽
  [126.8547147, 37.6913658,  906, 1628],  // 13. 9번 건물 왼쪽
  [126.8549892, 37.691485,   637, 1410],  // 14. 7번 화장실 왼쪽 위
  [126.8551613, 37.6910779, 1115, 1058],  // 15. 7번 화장실 오른쪽 위
  [126.8550951, 37.691057,  1153, 1118],  // 16. 7번 화장실 오른쪽 아래
];

// ── 아핀 변환 최소제곱법 ────────────────────────────────────────────────────
// px = a*lng + b*lat + c
// py = d*lng + e*lat + f
function computeAffine(gcps) {
  let ATA = [[0,0,0],[0,0,0],[0,0,0]];
  let ATbx = [0,0,0], ATby = [0,0,0];
  for (const [lng, lat, px, py] of gcps) {
    const r = [lng, lat, 1];
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 3; j++) ATA[i][j] += r[i]*r[j];
      ATbx[i] += r[i]*px;
      ATby[i] += r[i]*py;
    }
  }
  function solve(A, b) {
    const M = A.map((row, i) => [...row, b[i]]);
    for (let c = 0; c < 3; c++) {
      let p = c;
      for (let r = c+1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = 0; r < 3; r++) {
        if (r === c) continue;
        const f = M[r][c] / M[c][c];
        for (let k = c; k <= 3; k++) M[r][k] -= f*M[c][k];
      }
    }
    return [M[0][3]/M[0][0], M[1][3]/M[1][1], M[2][3]/M[2][2]];
  }
  const [a, b, c] = solve(ATA, ATbx);
  const [d, e, f] = solve(ATA, ATby);
  return { a, b, c, d, e, f };
}

const affine = computeAffine(GCPs);

function gpsToNaturalPx(lng, lat) {
  return {
    x: affine.a*lng + affine.b*lat + affine.c,
    y: affine.d*lng + affine.e*lat + affine.f,
  };
}

// ── 캔버스 리사이즈 ─────────────────────────────────────────────────────────
const mapImg    = document.getElementById('mapImg');
const canvas    = document.getElementById('gpsCanvas');
const ctx       = canvas.getContext('2d');
const gpsDot    = document.getElementById('gpsDot');

function syncCanvasSize() {
  canvas.width  = mapImg.clientWidth;
  canvas.height = mapImg.clientHeight;
  redrawOverlay();
}

new ResizeObserver(syncCanvasSize).observe(mapImg);
if (mapImg.complete) syncCanvasSize();
else mapImg.addEventListener('load', syncCanvasSize);

// ── 오버레이 그리기 ─────────────────────────────────────────────────────────
let currentPos = null;

function redrawOverlay() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!currentPos) return;

  const scaleX = canvas.width  / mapImg.naturalWidth;
  const scaleY = canvas.height / mapImg.naturalHeight;
  const { x: nx, y: ny } = gpsToNaturalPx(currentPos.lng, currentPos.lat);
  const cx = nx * scaleX;
  const cy = ny * scaleY;

  // 정확도 반경 원
  if (currentPos.accuracy) {
    // 위도 1도 ≈ 111000m, affine.e = lat→py 계수 (자연 픽셀/도)
    const pxPerMeter = Math.abs(affine.e) * scaleY / 111000;
    const r = Math.max(currentPos.accuracy * pxPerMeter, 18);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2*Math.PI);
    ctx.fillStyle = 'rgba(212,255,0,0.07)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(212,255,0,0.22)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // DOM 점 위치 업데이트
  gpsDot.style.left = cx + 'px';
  gpsDot.style.top  = cy + 'px';
  gpsDot.style.display = 'block';
}

// ── 공원 경계 체크 ──────────────────────────────────────────────────────────
const PARK = { latMin: 37.688, latMax: 37.693, lngMin: 126.852, lngMax: 126.857 };
function inPark(lng, lat) {
  return lng >= PARK.lngMin && lng <= PARK.lngMax &&
         lat >= PARK.latMin && lat <= PARK.latMax;
}

// ── GPS 상태 UI ─────────────────────────────────────────────────────────────
const gpsBar  = document.getElementById('gpsBar');
const barText = document.getElementById('gpsBarText');

function setStatus(state, text) {
  gpsBar.className = 'gps-bar ' + state;
  barText.textContent = text;
}

// ── GPS 추적 시작 ────────────────────────────────────────────────────────────
if (!('geolocation' in navigator)) {
  setStatus('error', '이 브라우저는 위치 기능을 지원하지 않아요');
} else {
  navigator.geolocation.watchPosition(
    ({ coords }) => {
      const { longitude: lng, latitude: lat, accuracy } = coords;

      if (!inPark(lng, lat)) {
        currentPos = null;
        gpsDot.style.display = 'none';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setStatus('outside', '공원 밖에 있어요');
        return;
      }

      currentPos = { lng, lat, accuracy };
      redrawOverlay();
      setStatus('found', `내 위치 확인됨 · 정확도 ${Math.round(accuracy)}m`);
    },
    ({ code }) => {
      const msgs = { 1: '위치 접근이 거부됐어요', 2: '위치를 찾을 수 없어요', 3: '시간 초과' };
      setStatus('error', msgs[code] || '위치 오류');
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 }
  );
}
</script>

</body>
</html>
