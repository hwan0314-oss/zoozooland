<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZZL 가이드맵 — 쥬쥬랜드</title>
  <meta name="description" content="쥬쥬랜드 가이드맵. 동물 관람 구역, 편의시설, 프로그램 안내.">
  <meta property="og:title" content="ZZL 가이드맵">
  <meta property="og:description" content="쥬쥬랜드 현장 가이드맵">
  <meta property="og:image" content="https://zoozoo.kr/images/guidemap.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; background: #0A0B0A; color: #fff; font-family: 'Inter', sans-serif; }

    /* ── 지도 뷰어: 화면 전체 ── */
    .map-viewer {
      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      background: #0A0B0A; touch-action: none;
    }

    /* 줌/팬 컨테이너 */
    .map-transform { position: relative; flex-shrink: 0; transform-origin: center; touch-action: none; }

    /* 터치 캡처 레이어 — 맵(z:1) 위, 버튼(z:20) 아래에서 모든 맵 터치를 전담 처리 */
    #touchLayer { position: fixed; inset: 0; z-index: 10; touch-action: none; }
    .map-img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
    .gps-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .gps-dot { position: absolute; width: 22px; height: 22px; transform: translate(-50%,-50%); pointer-events: none; display: none; }
    .gps-dot::after { content:''; position:absolute; inset:4px; border-radius:50%; background:#FF3B30; border:2.5px solid #fff; box-shadow:0 0 8px rgba(255,59,48,0.6); }
    .gps-dot::before { content:''; position:absolute; inset:0; border-radius:50%; border:2px solid rgba(255,59,48,0.45); animation:gps-ring 2s cubic-bezier(0,0,0.2,1) infinite; }
    @keyframes gps-ring { 0%{transform:scale(0.8);opacity:0.8;} 100%{transform:scale(2.8);opacity:0;} }

    /* ── 플로팅 오버레이: 뒤로 버튼 ── */
    .ov-back {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      display: flex; align-items: center; min-height: 40px; padding: 0 14px;
      background: rgba(10,11,10,0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.65); text-decoration: none;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; transition: color 0.2s;
    }
    .ov-back:hover { color: #D4FF00; }

    /* ── 플로팅 오버레이: PDF 버튼 ── */
    .ov-pdf {
      position: fixed; top: 14px; right: 14px; z-index: 20;
      display: flex; align-items: center; min-height: 40px; padding: 0 14px;
      background: #D4FF00; color: #0A0B0A;
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; font-weight: 900;
      text-transform: uppercase; letter-spacing: 0.08em; text-decoration: none; transition: filter 0.2s;
    }
    .ov-pdf:hover { filter: brightness(1.1); }

    /* ── GPS 상태 필 ── */
    .gps-pill {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px;
      background: rgba(10,11,10,0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 24px; border: 1px solid transparent;
      font-family: 'JetBrains Mono', monospace; font-size: 0.48rem;
      text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap;
      transition: border-color 0.4s;
    }
    .gps-pill.found { border-color: rgba(212,255,0,0.2); }
    .gps-dot-sm { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background 0.4s; }
    .gps-pill.finding .gps-dot-sm { background: rgba(255,255,255,0.3); }
    .gps-pill.found   .gps-dot-sm { background: #D4FF00; animation: dot-blink 2.4s ease-in-out infinite; }
    .gps-pill.outside .gps-dot-sm { background: rgba(255,200,0,0.7); }
    .gps-pill.error   .gps-dot-sm { background: rgba(255,80,80,0.7); }
    #gpsBarText { color: rgba(255,255,255,0.45); transition: color 0.4s; }
    .gps-pill.found #gpsBarText { color: rgba(212,255,0,0.65); }
    @keyframes dot-blink { 0%,100%{opacity:1;} 50%{opacity:0.25;} }

    /* ── 전화번호 (하단) ── */
    .ov-tel {
      position: fixed; bottom: 12px; right: 14px; z-index: 20;
      color: rgba(255,255,255,0.2); font-family: 'JetBrains Mono', monospace;
      font-size: 0.5rem; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em;
      transition: color 0.2s;
    }
    .ov-tel:hover { color: rgba(255,255,255,0.5); }

    /* ── 줌 힌트 ── */
    .map-hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 15; font-family: 'JetBrains Mono', monospace; font-size: 0.45rem; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.2); pointer-events: none; white-space: nowrap; transition: opacity 1s; }
    .map-hint.hidden { opacity: 0; }

    /* ── 가로 화면: 버튼 소형화 ── */
    @media (max-height: 500px) {
      .ov-back, .ov-pdf, .gps-pill { top: 8px; min-height: 34px; font-size: 0.55rem; }
      .ov-tel { bottom: 6px; font-size: 0.45rem; }
      .map-hint { bottom: 6px; }
    }

    /* ── 테스트 패널 ── */
    .test-panel { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; background: rgba(10,11,10,0.88); border: 1px solid rgba(212,255,0,0.3); padding: 10px 8px; backdrop-filter: blur(12px); }
    .test-label { font-family: 'JetBrains Mono', monospace; font-size: 0.42rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; color: #D4FF00; margin-bottom: 2px; text-align: center; }
    .test-btn { font-family: 'JetBrains Mono', monospace; font-size: 0.48rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; background: transparent; border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.55); padding: 7px 10px; cursor: pointer; transition: all 0.2s; white-space: nowrap; text-align: left; }
    .test-btn:hover { border-color: #D4FF00; color: #D4FF00; }
    .test-btn.active { border-color: #D4FF00; background: rgba(212,255,0,0.1); color: #D4FF00; }
  </style>
</head>
<body>

<!-- 지도: 화면 전체 -->
<div class="map-viewer" id="mapViewer">
  <div class="map-transform" id="mapTransform">
    <img src="images/guidemap.png" alt="ZZL 쥬쥬랜드 가이드맵" class="map-img" id="mapImg">
    <canvas class="gps-canvas" id="gpsCanvas"></canvas>
    <div class="gps-dot" id="gpsDot"></div>
  </div>
</div>

<!-- 터치 캡처 레이어 (맵 터치 전담, 버튼은 z:20으로 그 위에서 독립 처리) -->
<div id="touchLayer"></div>

<!-- 플로팅 오버레이 -->
<a href="/" class="ov-back">← 홈</a>
<a href="images/guidemap.pdf" download="ZZL_가이드맵.pdf" class="ov-pdf">PDF</a>
<div class="gps-pill finding" id="gpsBar">
  <span class="gps-dot-sm"></span>
  <span id="gpsBarText">위치 찾는 중</span>
</div>
<a href="tel:031-962-4500" class="ov-tel">031-962-4500</a>

<!-- 줌 힌트 -->
<div class="map-hint" id="mapHint">두 손가락으로 확대 · 두 번 탭으로 줌</div>

<!-- 테스트 패널 (URL에 ?test 있을 때만 표시) -->
<div class="test-panel" id="testPanel" style="display:none">
  <div class="test-label">TEST</div>
  <button class="test-btn" data-lng="126.8538597" data-lat="37.6903466">입구</button>
  <button class="test-btn" data-lng="126.8549816" data-lat="37.6897766">파충류관</button>
  <button class="test-btn" data-lng="126.8551222" data-lat="37.6908717">로봇박물관</button>
  <button class="test-btn" data-lng="126.8547496" data-lat="37.6905664">악어빌리지</button>
  <button class="test-btn" data-lng="126.8549892" data-lat="37.691485">화장실</button>
  <button class="test-btn" data-lng="126.8541615" data-lat="37.690084">식당</button>
</div>

<script>
// ── GCP 데이터 [경도, 위도, 픽셀X, 픽셀Y] — 원본: 4492×3176 ────────────────
const GCPs = [
  [126.8538597, 37.6903466, 2487, 2054],
  [126.8540339, 37.6902809, 2510, 1839],
  [126.8535053, 37.6898443, 3273, 2218],
  [126.8543281, 37.689641,  3258, 1219],
  [126.8537643, 37.6902084, 2694, 2096],
  [126.8541615, 37.690084,  2718, 1637],
  [126.8543509, 37.6899381, 2838, 1380],
  [126.8549816, 37.6897766, 2835,  664],
  [126.8553769, 37.6901253, 2232,  423],
  [126.8547496, 37.6905664, 1888, 1249],
  [126.8551222, 37.6908717, 1372, 1004],
  [126.8546258, 37.6911832, 1159, 1622],
  [126.8547147, 37.6913658,  906, 1628],
  [126.8549892, 37.691485,   637, 1410],
  [126.8551613, 37.6910779, 1115, 1058],
  [126.8550951, 37.691057,  1153, 1118],
];

// ── 아핀 변환 최소제곱법 ─────────────────────────────────────────────────────
function computeAffine(gcps) {
  let ATA=[[0,0,0],[0,0,0],[0,0,0]], ATbx=[0,0,0], ATby=[0,0,0];
  for (const [lng,lat,px,py] of gcps) {
    const r=[lng,lat,1];
    for (let i=0;i<3;i++) { for (let j=0;j<3;j++) ATA[i][j]+=r[i]*r[j]; ATbx[i]+=r[i]*px; ATby[i]+=r[i]*py; }
  }
  function solve(A,b) {
    const M=A.map((row,i)=>[...row,b[i]]);
    for (let c=0;c<3;c++) {
      let p=c; for (let r=c+1;r<3;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
      [M[c],M[p]]=[M[p],M[c]];
      for (let r=0;r<3;r++) { if(r===c) continue; const f=M[r][c]/M[c][c]; for (let k=c;k<=3;k++) M[r][k]-=f*M[c][k]; }
    }
    return [M[0][3]/M[0][0], M[1][3]/M[1][1], M[2][3]/M[2][2]];
  }
  const [a,b,c]=solve(ATA,ATbx), [d,e,f]=solve(ATA,ATby);
  return {a,b,c,d,e,f};
}
const affine = computeAffine(GCPs);
function gpsToNaturalPx(lng,lat) { return { x:affine.a*lng+affine.b*lat+affine.c, y:affine.d*lng+affine.e*lat+affine.f }; }

// ── DOM 참조 ─────────────────────────────────────────────────────────────────
const mapViewer=document.getElementById('mapViewer'), mapTransform=document.getElementById('mapTransform');
const mapImg=document.getElementById('mapImg'), canvas=document.getElementById('gpsCanvas'), ctx=canvas.getContext('2d');
const gpsDot=document.getElementById('gpsDot'), gpsBar=document.getElementById('gpsBar'), barText=document.getElementById('gpsBarText');
const hintEl=document.getElementById('mapHint');

// ── 줌/팬 상태 ───────────────────────────────────────────────────────────────
let scale=1, tx=0, ty=0, displayW=0, displayH=0;
const MAX_SCALE=6;

function applyTransform() { mapTransform.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function clamp() {
  tx=Math.max(-displayW*(scale-1)/2, Math.min(displayW*(scale-1)/2, tx));
  ty=Math.max(-displayH*(scale-1)/2, Math.min(displayH*(scale-1)/2, ty));
}

// ── 뷰어 크기 초기화 ─────────────────────────────────────────────────────────
function initSizes() {
  if (!mapImg.naturalWidth) return;
  const aw=window.innerWidth, ah=window.innerHeight;
  const ir=mapImg.naturalWidth/mapImg.naturalHeight, ar=aw/ah;
  displayW = ir>ar ? aw : ah*ir;
  displayH = ir>ar ? aw/ir : ah;
  mapTransform.style.width=Math.round(displayW)+'px';
  mapTransform.style.height=Math.round(displayH)+'px';
  canvas.width=Math.round(displayW); canvas.height=Math.round(displayH);
  scale=1; tx=0; ty=0;
  applyTransform(); redrawOverlay();
}
window.addEventListener('resize', initSizes);
if (mapImg.complete && mapImg.naturalWidth) initSizes();
else mapImg.addEventListener('load', initSizes);

// ── GPS 오버레이 ─────────────────────────────────────────────────────────────
let currentPos=null;
function redrawOverlay() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (!currentPos || !displayW) return;
  const sx=displayW/mapImg.naturalWidth, sy=displayH/mapImg.naturalHeight;
  const {x:nx,y:ny}=gpsToNaturalPx(currentPos.lng,currentPos.lat);
  const cx=nx*sx, cy=ny*sy;
  // 진행 방향 (이동 중에만 heading 값이 유효)
  if (currentPos.heading != null && isFinite(currentPos.heading)) {
    const hr=currentPos.heading*Math.PI/180;
    const ndx=affine.a*Math.sin(hr)+affine.b*Math.cos(hr);
    const ndy=affine.d*Math.sin(hr)+affine.e*Math.cos(hr);
    const coneAngle=Math.atan2(ndy*sy, ndx*sx);
    const spread=Math.PI/5;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,52, coneAngle-spread/2, coneAngle+spread/2);
    ctx.closePath();
    ctx.fillStyle='rgba(255,59,48,0.28)'; ctx.fill();
  }
  // 정확도 반경
  if (currentPos.accuracy) {
    const r=Math.max(currentPos.accuracy*Math.abs(affine.e)*sy/111000, 18);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.fillStyle='rgba(255,59,48,0.07)'; ctx.fill();
    ctx.strokeStyle='rgba(255,59,48,0.22)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  gpsDot.style.left=cx+'px'; gpsDot.style.top=cy+'px'; gpsDot.style.display='block';
}

// ── GPS 추적 ─────────────────────────────────────────────────────────────────
function setStatus(s,t) { gpsBar.className='gps-pill '+s; barText.textContent=t; }
const PARK={latMin:37.688,latMax:37.693,lngMin:126.852,lngMax:126.857};
function inPark(lng,lat) { return lng>=PARK.lngMin&&lng<=PARK.lngMax&&lat>=PARK.latMin&&lat<=PARK.latMax; }

if (!('geolocation' in navigator)) {
  setStatus('error','위치 미지원');
} else {
  navigator.geolocation.watchPosition(
    ({coords:{longitude:lng,latitude:lat,accuracy,heading}}) => {
      if (!inPark(lng,lat)) { currentPos=null; gpsDot.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); setStatus('outside','공원 밖'); return; }
      currentPos={lng,lat,accuracy,heading}; redrawOverlay();
      setStatus('found',`정확도 ${Math.round(accuracy)}m`);
    },
    ({code}) => setStatus('error',{1:'위치 권한 거부',2:'위치 불명',3:'시간 초과'}[code]||'위치 오류'),
    {enableHighAccuracy:true,maximumAge:5000,timeout:30000}
  );
}

// ── 줌/팬 이벤트 ────────────────────────────────────────────────────────────
let dragStartX=0, dragStartY=0, dragTx=0, dragTy=0;
let tapTimer=null, isPinching=false;
let pinchDist=0, pinchMidX=0, pinchMidY=0;

function vcX() { return window.innerWidth/2; }
function vcY() { return window.innerHeight/2; }

function zoomAround(cx,cy,newScale) {
  const s=Math.max(1,Math.min(MAX_SCALE,newScale));
  tx=tx+(cx-vcX()-tx)*(1-s/scale);
  ty=ty+(cy-vcY()-ty)*(1-s/scale);
  scale=s; clamp(); applyTransform();
}

function doubleTap(cx,cy) {
  hideHint();
  if (scale>1.5) { scale=1; tx=0; ty=0; applyTransform(); }
  else zoomAround(cx,cy,3);
}

// 터치 캡처 레이어 — touch-action:none 명시 + 오버레이 버튼(z:20)은 자체 처리
// touch-action이 상속 안 되므로 레이어에 직접 설정해야 브라우저 제스처 가로채기 방지
const touchLayer = document.getElementById('touchLayer');
touchLayer.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t=[...e.touches];
  if (t.length===1) {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer=null; doubleTap(t[0].clientX,t[0].clientY); return; }
    tapTimer=setTimeout(()=>{tapTimer=null;},300);
    isPinching=false;
    dragStartX=t[0].clientX; dragStartY=t[0].clientY; dragTx=tx; dragTy=ty;
  } else if (t.length>=2) {
    clearTimeout(tapTimer); tapTimer=null; isPinching=true;
    pinchDist=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    pinchMidX=(t[0].clientX+t[1].clientX)/2; pinchMidY=(t[0].clientY+t[1].clientY)/2;
  }
},{passive:false});

touchLayer.addEventListener('touchmove', e=>{
  e.preventDefault();
  const t=[...e.touches];
  if (t.length>=2 && isPinching) {
    const d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    const mx=(t[0].clientX+t[1].clientX)/2, my=(t[0].clientY+t[1].clientY)/2;
    if (pinchDist>0) {
      const s=Math.max(1,Math.min(MAX_SCALE,scale*d/pinchDist));
      tx=tx+(mx-vcX()-tx)*(1-s/scale)+(mx-pinchMidX);
      ty=ty+(my-vcY()-ty)*(1-s/scale)+(my-pinchMidY);
      scale=s; clamp(); applyTransform(); hideHint();
    }
    pinchDist=d; pinchMidX=mx; pinchMidY=my;
  } else if (t.length===1 && !isPinching && scale>1) {
    tx=dragTx+(t[0].clientX-dragStartX); ty=dragTy+(t[0].clientY-dragStartY);
    clamp(); applyTransform();
  }
},{passive:false});

touchLayer.addEventListener('touchend', e=>{
  const t=[...e.touches];
  if (t.length<2) { isPinching=false; pinchDist=0; }
  if (t.length===0 && scale<1) { scale=1; tx=0; ty=0; applyTransform(); }
});

mapViewer.addEventListener('wheel',e=>{e.preventDefault(); zoomAround(e.clientX,e.clientY,scale*(e.deltaY<0?1.15:0.87));},{passive:false});
mapViewer.addEventListener('dblclick',e=>{hideHint(); zoomAround(e.clientX,e.clientY,scale>1.5?1:3);});

// 마우스 드래그 (PC)
let md=false,mTx=0,mTy=0,mSx=0,mSy=0;
mapViewer.addEventListener('mousedown',e=>{md=true;mSx=e.clientX;mSy=e.clientY;mTx=tx;mTy=ty;document.body.style.cursor='grabbing';});
window.addEventListener('mousemove',e=>{if(!md)return;tx=mTx+e.clientX-mSx;ty=mTy+e.clientY-mSy;clamp();applyTransform();});
window.addEventListener('mouseup',()=>{md=false;document.body.style.cursor='';});

let hintTimer=setTimeout(hideHint,3000);
function hideHint(){clearTimeout(hintTimer);hintEl.classList.add('hidden');}

// ── 테스트 모드 ───────────────────────────────────────────────────────────────
const TEST_MODE = new URLSearchParams(location.search).has('test');
if (TEST_MODE) {
  const testPanel = document.getElementById('testPanel');
  testPanel.style.display = 'flex';
  setStatus('outside', 'TEST MODE — 위치 선택');
  let activeBtn = null;
  testPanel.querySelectorAll('.test-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const lng = parseFloat(btn.dataset.lng), lat = parseFloat(btn.dataset.lat);
      currentPos = {lng, lat, accuracy: 8};
      redrawOverlay();
      setStatus('found', `TEST · ${btn.textContent} (${lat.toFixed(5)}, ${lng.toFixed(5)})`);
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      // 선택한 위치로 지도 이동 (중심)
      const sx=displayW/mapImg.naturalWidth, sy=displayH/mapImg.naturalHeight;
      const {x:nx,y:ny}=gpsToNaturalPx(lng,lat);
      const cx=nx*sx, cy=ny*sy;
      tx = -(cx - displayW/2) * scale;
      ty = -(cy - displayH/2) * scale;
      clamp(); applyTransform();
    });
  });
}
</script>

</body>
</html>
