<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZZL 가이드맵 — 쥬쥬랜드</title>
  <meta name="description" content="쥬쥬랜드 가이드맵. 동물 관람 구역, 편의시설, 프로그램 안내.">
  <meta property="og:title" content="ZZL 가이드맵">
  <meta property="og:description" content="쥬쥬랜드 현장 가이드맵">
  <meta property="og:image" content="https://zoozoo.kr/images/guidemap.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0B0A; color: #fff; font-family: 'Inter', sans-serif; }

    /* ── 지도 뷰어: 화면 전체 ── */
    .map-viewer {
      position: fixed; inset: 0; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: grab;
      background: #0A0B0A;
    }
    .map-viewer.dragging { cursor: grabbing; }

    /* 줌/팬 컨테이너 */
    .map-transform {
      position: relative; flex-shrink: 0;
      transform-origin: center;
    }
    .map-img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
    .gps-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .gps-dot { position: absolute; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; display: none; }
    .gps-dot::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #D4FF00; border: 2.5px solid #fff; box-shadow: 0 0 8px rgba(212,255,0,0.6); }
    .gps-dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(212,255,0,0.45); animation: gps-ring 2s cubic-bezier(0,0,0.2,1) infinite; }
    @keyframes gps-ring { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(2.8); opacity: 0; } }

    /* ── 오버레이: 상단 헤더 ── */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      height: 56px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,11,10,0.82);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-family: 'JetBrains Mono', monospace; font-weight: 900; font-size: 1rem; letter-spacing: 0.05em; color: #fff; text-decoration: none; }
    .logo span { color: #D4FF00; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-dl { background: #D4FF00; color: #0A0B0A; font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 16px; text-decoration: none; transition: filter 0.2s; }
    .btn-dl:hover { filter: brightness(1.1); }
    .btn-home { color: rgba(255,255,255,0.4); font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; text-decoration: none; transition: color 0.2s; }
    .btn-home:hover { color: #D4FF00; }

    /* ── 오버레이: GPS 상태 바 ── */
    .gps-bar {
      position: fixed; top: 56px; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      padding: 7px 20px;
      background: rgba(10,11,10,0.72);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-family: 'JetBrains Mono', monospace; font-size: 0.5rem;
      text-transform: uppercase; letter-spacing: 0.12em;
      transition: border-color 0.4s;
    }
    .gps-bar.found { border-bottom-color: rgba(212,255,0,0.15); }
    .gps-bar-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; transition: background 0.4s; }
    .gps-bar.finding  .gps-bar-dot { background: rgba(255,255,255,0.25); }
    .gps-bar.found    .gps-bar-dot { background: #D4FF00; animation: dot-blink 2.4s ease-in-out infinite; }
    .gps-bar.outside  .gps-bar-dot { background: rgba(255,200,0,0.7); }
    .gps-bar.error    .gps-bar-dot { background: rgba(255,80,80,0.7); }
    #gpsBarText { color: rgba(255,255,255,0.4); transition: color 0.4s; }
    .gps-bar.found #gpsBarText { color: rgba(212,255,0,0.6); }
    @keyframes dot-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* ── 오버레이: 하단 바 ── */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      height: 44px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,11,10,0.72);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .footer-info { color: rgba(255,255,255,0.2); font-size: 0.5rem; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; }
    .footer-tel { color: rgba(255,255,255,0.4); font-size: 0.55rem; font-family: 'JetBrains Mono', monospace; text-decoration: none; transition: color 0.2s; }
    .footer-tel:hover { color: #D4FF00; }

    /* ── 줌 힌트 ── */
    .map-hint { position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%); z-index: 15; font-family: 'JetBrains Mono', monospace; font-size: 0.45rem; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.2); pointer-events: none; white-space: nowrap; transition: opacity 1s; }
    .map-hint.hidden { opacity: 0; }
  </style>
</head>
<body>

<!-- 지도: 화면 전체 -->
<div class="map-viewer" id="mapViewer">
  <div class="map-transform" id="mapTransform">
    <img src="images/guidemap.png" alt="ZZL 쥬쥬랜드 가이드맵" class="map-img" id="mapImg">
    <canvas class="gps-canvas" id="gpsCanvas"></canvas>
    <div class="gps-dot" id="gpsDot"></div>
  </div>
</div>

<!-- 오버레이: 헤더 -->
<header>
  <a href="/" class="logo"><span>ZZL</span> 쥬쥬랜드</a>
  <div class="header-right">
    <a href="/" class="btn-home">← 홈</a>
    <a href="images/guidemap.pdf" download="ZZL_가이드맵.pdf" class="btn-dl">PDF 저장</a>
  </div>
</header>

<!-- 오버레이: GPS 상태 -->
<div class="gps-bar finding" id="gpsBar">
  <span class="gps-bar-dot"></span>
  <span id="gpsBarText">내 위치 찾는 중...</span>
</div>

<!-- 오버레이: 하단 정보 -->
<footer>
  <span class="footer-info">ZZL_MAP · zoozoo.kr/map</span>
  <a href="tel:031-962-4500" class="footer-tel">031-962-4500</a>
</footer>

<!-- 줌 힌트 -->
<div class="map-hint" id="mapHint">PINCH · ZOOM · DBL TAP</div>

<script>
// ── GCP 데이터 [경도, 위도, 픽셀X, 픽셀Y] — 원본: 4492×3176 ────────────────
const GCPs = [
  [126.8538597, 37.6903466, 2487, 2054],
  [126.8540339, 37.6902809, 2510, 1839],
  [126.8535053, 37.6898443, 3273, 2218],
  [126.8543281, 37.689641,  3258, 1219],
  [126.8537643, 37.6902084, 2694, 2096],
  [126.8541615, 37.690084,  2718, 1637],
  [126.8543509, 37.6899381, 2838, 1380],
  [126.8549816, 37.6897766, 2835,  664],
  [126.8553769, 37.6901253, 2232,  423],
  [126.8547496, 37.6905664, 1888, 1249],
  [126.8551222, 37.6908717, 1372, 1004],
  [126.8546258, 37.6911832, 1159, 1622],
  [126.8547147, 37.6913658,  906, 1628],
  [126.8549892, 37.691485,   637, 1410],
  [126.8551613, 37.6910779, 1115, 1058],
  [126.8550951, 37.691057,  1153, 1118],
];

// ── 아핀 변환 최소제곱법 ─────────────────────────────────────────────────────
function computeAffine(gcps) {
  let ATA=[[0,0,0],[0,0,0],[0,0,0]], ATbx=[0,0,0], ATby=[0,0,0];
  for (const [lng,lat,px,py] of gcps) {
    const r=[lng,lat,1];
    for (let i=0;i<3;i++) { for (let j=0;j<3;j++) ATA[i][j]+=r[i]*r[j]; ATbx[i]+=r[i]*px; ATby[i]+=r[i]*py; }
  }
  function solve(A,b) {
    const M=A.map((row,i)=>[...row,b[i]]);
    for (let c=0;c<3;c++) {
      let p=c; for (let r=c+1;r<3;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
      [M[c],M[p]]=[M[p],M[c]];
      for (let r=0;r<3;r++) { if(r===c) continue; const f=M[r][c]/M[c][c]; for (let k=c;k<=3;k++) M[r][k]-=f*M[c][k]; }
    }
    return [M[0][3]/M[0][0], M[1][3]/M[1][1], M[2][3]/M[2][2]];
  }
  const [a,b,c]=solve(ATA,ATbx), [d,e,f]=solve(ATA,ATby);
  return {a,b,c,d,e,f};
}
const affine = computeAffine(GCPs);
function gpsToNaturalPx(lng,lat) { return { x:affine.a*lng+affine.b*lat+affine.c, y:affine.d*lng+affine.e*lat+affine.f }; }

// ── DOM 참조 ─────────────────────────────────────────────────────────────────
const mapViewer=document.getElementById('mapViewer'), mapTransform=document.getElementById('mapTransform');
const mapImg=document.getElementById('mapImg'), canvas=document.getElementById('gpsCanvas'), ctx=canvas.getContext('2d');
const gpsDot=document.getElementById('gpsDot'), gpsBar=document.getElementById('gpsBar'), barText=document.getElementById('gpsBarText');
const hintEl=document.getElementById('mapHint');

// ── 줌/팬 상태 ───────────────────────────────────────────────────────────────
let scale=1, tx=0, ty=0, displayW=0, displayH=0;
const MAX_SCALE=6;

function applyTransform() { mapTransform.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function clamp() {
  tx=Math.max(-displayW*(scale-1)/2, Math.min(displayW*(scale-1)/2, tx));
  ty=Math.max(-displayH*(scale-1)/2, Math.min(displayH*(scale-1)/2, ty));
}

// ── 뷰어 크기 초기화 ─────────────────────────────────────────────────────────
function initSizes() {
  if (!mapImg.naturalWidth) return;
  const aw=window.innerWidth, ah=window.innerHeight;
  const ir=mapImg.naturalWidth/mapImg.naturalHeight, ar=aw/ah;
  displayW = ir>ar ? aw : ah*ir;
  displayH = ir>ar ? aw/ir : ah;
  mapTransform.style.width=Math.round(displayW)+'px';
  mapTransform.style.height=Math.round(displayH)+'px';
  canvas.width=Math.round(displayW); canvas.height=Math.round(displayH);
  scale=1; tx=0; ty=0;
  applyTransform(); redrawOverlay();
}
window.addEventListener('resize', initSizes);
if (mapImg.complete && mapImg.naturalWidth) initSizes();
else mapImg.addEventListener('load', initSizes);

// ── GPS 오버레이 ─────────────────────────────────────────────────────────────
let currentPos=null;
function redrawOverlay() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (!currentPos || !displayW) return;
  const sx=displayW/mapImg.naturalWidth, sy=displayH/mapImg.naturalHeight;
  const {x:nx,y:ny}=gpsToNaturalPx(currentPos.lng,currentPos.lat);
  const cx=nx*sx, cy=ny*sy;
  if (currentPos.accuracy) {
    const r=Math.max(currentPos.accuracy*Math.abs(affine.e)*sy/111000, 18);
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.fillStyle='rgba(212,255,0,0.07)'; ctx.fill();
    ctx.strokeStyle='rgba(212,255,0,0.22)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  gpsDot.style.left=cx+'px'; gpsDot.style.top=cy+'px'; gpsDot.style.display='block';
}

// ── GPS 추적 ─────────────────────────────────────────────────────────────────
function setStatus(s,t) { gpsBar.className='gps-bar '+s; barText.textContent=t; }
const PARK={latMin:37.688,latMax:37.693,lngMin:126.852,lngMax:126.857};
function inPark(lng,lat) { return lng>=PARK.lngMin&&lng<=PARK.lngMax&&lat>=PARK.latMin&&lat<=PARK.latMax; }

if (!('geolocation' in navigator)) {
  setStatus('error','이 브라우저는 위치 기능을 지원하지 않아요');
} else {
  navigator.geolocation.watchPosition(
    ({coords:{longitude:lng,latitude:lat,accuracy}}) => {
      if (!inPark(lng,lat)) { currentPos=null; gpsDot.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); setStatus('outside','공원 밖에 있어요'); return; }
      currentPos={lng,lat,accuracy}; redrawOverlay();
      setStatus('found',`내 위치 확인됨 · 정확도 ${Math.round(accuracy)}m`);
    },
    ({code}) => setStatus('error',{1:'위치 접근이 거부됐어요',2:'위치를 찾을 수 없어요',3:'시간 초과'}[code]||'위치 오류'),
    {enableHighAccuracy:true,maximumAge:5000,timeout:30000}
  );
}

// ── 줌/팬 이벤트 ─────────────────────────────────────────────────────────────
let touches=[], lastDist=0, lastMidX=0, lastMidY=0, isPinching=false;
let dragStartX=0, dragStartY=0, dragTx=0, dragTy=0;
let tapTimer=null;

function vcX() { return window.innerWidth/2; }
function vcY() { return window.innerHeight/2; }

function zoomAround(cx,cy,newScale) {
  const s=Math.max(1,Math.min(MAX_SCALE,newScale));
  tx=tx+(cx-vcX()-tx)*(1-s/scale);
  ty=ty+(cy-vcY()-ty)*(1-s/scale);
  scale=s; clamp(); applyTransform();
}

function doubleTap(cx,cy) {
  hideHint();
  if (scale>1.5) { scale=1; tx=0; ty=0; applyTransform(); }
  else zoomAround(cx,cy,3);
}

mapViewer.addEventListener('touchstart', e=>{
  e.preventDefault(); touches=[...e.touches];
  if (touches.length===1) {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer=null; doubleTap(touches[0].clientX,touches[0].clientY); return; }
    tapTimer=setTimeout(()=>{tapTimer=null;},280);
    dragStartX=touches[0].clientX; dragStartY=touches[0].clientY; dragTx=tx; dragTy=ty; isPinching=false;
  } else if (touches.length===2) {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer=null; }
    isPinching=true;
    lastDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    lastMidX=(touches[0].clientX+touches[1].clientX)/2; lastMidY=(touches[0].clientY+touches[1].clientY)/2;
  }
},{passive:false});

mapViewer.addEventListener('touchmove', e=>{
  e.preventDefault(); touches=[...e.touches];
  if (touches.length===2) {
    hideHint();
    const d=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    const midX=(touches[0].clientX+touches[1].clientX)/2, midY=(touches[0].clientY+touches[1].clientY)/2;
    const s=Math.max(1,Math.min(MAX_SCALE,scale*d/lastDist));
    tx=tx+(midX-vcX()-tx)*(1-s/scale)+(midX-lastMidX);
    ty=ty+(midY-vcY()-ty)*(1-s/scale)+(midY-lastMidY);
    scale=s; clamp(); applyTransform();
    lastDist=d; lastMidX=midX; lastMidY=midY;
  } else if (touches.length===1&&!isPinching&&scale>1) {
    tx=dragTx+(touches[0].clientX-dragStartX); ty=dragTy+(touches[0].clientY-dragStartY);
    clamp(); applyTransform();
  }
},{passive:false});

mapViewer.addEventListener('touchend', e=>{
  touches=[...e.touches];
  if (touches.length<2) { isPinching=false; if(scale<1){scale=1;tx=0;ty=0;applyTransform();} }
});

mapViewer.addEventListener('wheel',e=>{e.preventDefault(); zoomAround(e.clientX,e.clientY,scale*(e.deltaY<0?1.15:0.87));},{passive:false});
mapViewer.addEventListener('dblclick',e=>{hideHint(); zoomAround(e.clientX,e.clientY,scale>1.5?1:3);});

let md=false,mTx=0,mTy=0,mSx=0,mSy=0;
mapViewer.addEventListener('mousedown',e=>{md=true;mSx=e.clientX;mSy=e.clientY;mTx=tx;mTy=ty;mapViewer.classList.add('dragging');});
window.addEventListener('mousemove',e=>{if(!md)return;tx=mTx+e.clientX-mSx;ty=mTy+e.clientY-mSy;clamp();applyTransform();});
window.addEventListener('mouseup',()=>{md=false;mapViewer.classList.remove('dragging');});

let hintTimer=setTimeout(hideHint,3000);
function hideHint(){clearTimeout(hintTimer);hintEl.classList.add('hidden');}
</script>

</body>
</html>
