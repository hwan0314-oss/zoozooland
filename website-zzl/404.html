<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없어요 — 쥬쥬랜드</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <style>
    /* GitHub Pages 가 없는 주소에 404 상태로 보여 주는 페이지. 어느 경로에서든 열리므로 링크는 모두 절대경로 */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--forest-black); color: #fff; }
    .nf { padding: 48px 24px; text-align: center; font-family: 'Noto Sans KR', sans-serif; }
    .nf-code { font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.2em; color: var(--zzl-lime); }
    .nf h1 { margin: 16px 0 12px; font-size: 32px; font-weight: 900; }
    .nf p { margin: 0 0 32px; color: rgba(255,255,255,0.65); line-height: 1.7; }
    .nf a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: var(--zzl-lime); color: var(--forest-black); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-code">404</div>
    <h1>앗, 길을 잃었어요</h1>
    <p>찾으시는 페이지가 없거나 주소가 바뀌었어요.<br>쥬쥬랜드 홈에서 다시 찾아봐 주세요.</p>
    <a href="/">쥬쥬랜드 홈으로</a>
  </main>
</body>
</html>
