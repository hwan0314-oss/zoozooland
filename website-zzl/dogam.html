<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>쥬쥬랜드 동물도감</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0B0A;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

#mapDiv{position:fixed;inset:0;z-index:1}
.leaflet-container{background:#0A0B0A !important}

.gps-icon{background:transparent !important;border:none !important}
.gps-icon-inner{position:absolute;top:4px;left:4px;right:4px;bottom:4px;border-radius:50%;
  background:#7D9E7E;border:2.5px solid #fff;box-shadow:0 0 8px rgba(125,158,126,0.6)}
.gps-icon-ring{position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(125,158,126,0.45);
  animation:gps-ring 2s cubic-bezier(0,0,0.2,1) infinite}
@keyframes gps-ring{0%{transform:scale(0.8);opacity:0.8}100%{transform:scale(2.8);opacity:0}}

.gps-pill{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;
  background:rgba(10,11,10,0.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:20px;border:1px solid transparent;
  font-family:monospace;font-size:0.5rem;text-transform:uppercase;letter-spacing:0.1em;
  white-space:nowrap;transition:border-color 0.4s;pointer-events:none}
.gps-pill.found{border-color:rgba(125,158,126,0.35)}
.gps-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background 0.4s;background:rgba(255,255,255,0.2)}
.gps-pill.found .gps-dot{background:#7D9E7E;animation:dotblink 2.4s ease-in-out infinite}
.gps-pill.outside .gps-dot{background:rgba(255,200,0,0.7)}
.gps-pill.error .gps-dot{background:rgba(255,80,80,0.7)}
#gpsBarText{color:rgba(255,255,255,0.38);transition:color 0.4s}
.gps-pill.found #gpsBarText{color:rgba(125,158,126,0.75)}
@keyframes dotblink{0%,100%{opacity:1}50%{opacity:0.25}}

.ov-back{position:fixed;top:12px;left:12px;z-index:20;display:flex;align-items:center;
  height:44px;padding:0 18px;background:rgba(10,11,10,0.82);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);color:rgba(255,255,255,0.55);text-decoration:none;
  font-family:monospace;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em}
.ov-back:hover{color:#7D9E7E}
#dexBtn{position:fixed;top:12px;right:12px;z-index:20;
  height:44px;padding:0 20px;background:#7D9E7E;color:#0A0B0A;border:none;cursor:pointer;
  font-family:monospace;font-size:0.68rem;font-weight:900;text-transform:uppercase;letter-spacing:0.08em}
#dexBtn:active{filter:brightness(1.2)}

#zoneBadge{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:20;
  max-width:88vw;display:none;align-items:center;padding:7px 14px;
  background:rgba(125,158,126,0.12);border:1px solid rgba(125,158,126,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:monospace;font-size:0.55rem;text-transform:uppercase;
  letter-spacing:0.08em;color:#7D9E7E;text-align:center}
#zoneBadge.on{display:flex}

.zoom-btns{position:fixed;right:14px;bottom:64px;z-index:20;display:flex;flex-direction:column;gap:5px}
.zoom-btn{width:40px;height:40px;background:rgba(10,11,10,0.65);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.6);
  font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom-btn:active{border-color:#7D9E7E;color:#7D9E7E}

#testPanel{position:fixed;bottom:0;left:0;right:0;z-index:25;display:none;
  flex-wrap:wrap;gap:4px;padding:8px;background:rgba(0,0,0,0.88);max-height:140px;overflow-y:auto}
#testPanel button{flex:1;min-width:120px;padding:5px 6px;background:#1a1a1a;
  border:1px solid #2a2a2a;color:#888;font-size:0.58rem;cursor:pointer;text-align:center}
#testPanel button.active{background:rgba(125,158,126,0.15);border-color:#7D9E7E;color:#7D9E7E}

.animal-pin{cursor:pointer}
.animal-pin img{width:88px;height:88px;object-fit:contain;
  animation:animalPop 0.55s cubic-bezier(0.22,0.61,0.36,1) forwards;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,0.7))}
@keyframes animalPop{
  0%{transform:scale(0) translateY(16px);opacity:0}
  60%{transform:scale(1.15) translateY(-4px);opacity:1}
  80%{transform:scale(0.95) translateY(0)}
  100%{transform:scale(1) translateY(0)}}
.animal-pin-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  white-space:nowrap;background:rgba(10,11,10,0.88);color:#7D9E7E;
  font-size:0.5rem;font-family:monospace;padding:2px 7px;pointer-events:none;letter-spacing:0.05em}

#modal{position:fixed;inset:0;z-index:30;background:rgba(8,9,8,0.95);
  display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal[hidden]{display:none}
#sheet{max-width:440px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}

.stage{position:relative;background:#0d0d0d;flex-shrink:0}
.stage canvas{display:block;width:100%;height:260px}
.stage-full{flex:1;flex-shrink:1;display:flex;flex-direction:column;justify-content:center}
.sil-img{display:block;width:100%;height:260px;object-fit:contain;filter:brightness(0.28) saturate(0)}
@media(min-height:700px){.stage canvas{height:300px}}
.quiz-panel{background:#0d0d0d}
.stag{position:absolute;top:10px;left:14px;font-family:monospace;font-size:0.45rem;
  color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:0.12em}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flashbang 0.42s forwards}
@keyframes flashbang{0%{opacity:0.65}100%{opacity:0}}

.qhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 2px;gap:8px}
.qhead .kname-big{font-size:1.05rem;font-weight:700;letter-spacing:-0.01em;color:#fff}
.qhead span{font-family:monospace;font-size:0.6rem;color:rgba(255,255,255,0.28);white-space:nowrap}
.qtip{padding:4px 18px 12px;font-size:0.72rem;color:rgba(255,255,255,0.45);line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px 6px}
.opt{background:#161616;border:2px solid transparent;padding:4px;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color 0.18s}
.opt img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.opt:active{border-color:rgba(125,158,126,0.35)}
.opt.yes{border-color:#7D9E7E;background:rgba(125,158,126,0.1)}
.opt.no{border-color:rgba(255,70,70,0.45);animation:shk 0.28s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qbar{padding:10px 18px 24px}
.qbar button{display:block;width:100%;height:44px;border:1px solid rgba(255,255,255,0.12);
  background:transparent;color:rgba(255,255,255,0.4);font-size:0.68rem;cursor:pointer}
.qbar button:active{color:rgba(255,80,80,0.65);border-color:rgba(255,80,80,0.25)}

.body{padding:16px 18px}
.nameline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.kname{font-size:1.25rem;font-weight:700}
.ename{font-family:monospace;font-size:0.6rem;color:rgba(255,255,255,0.3);
  text-transform:uppercase;letter-spacing:0.06em}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:3px 9px;border:1px solid rgba(255,255,255,0.1);
  font-family:monospace;font-size:0.48rem;color:rgba(255,255,255,0.35);
  text-transform:uppercase;letter-spacing:0.06em}
.chip.z{border-color:rgba(125,158,126,0.3);color:#7D9E7E}
dl.rows{border-top:1px solid rgba(255,255,255,0.07)}
.row{display:flex;flex-direction:column;gap:4px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.07)}
.row dt{font-family:monospace;font-size:0.45rem;text-transform:uppercase;
  letter-spacing:0.12em;color:rgba(255,255,255,0.25)}
.row dd{font-size:0.75rem;color:rgba(255,255,255,0.72);line-height:1.55}
.row dd em{font-style:italic;color:rgba(255,255,255,0.45)}
.pend{color:rgba(255,255,255,0.18) !important;font-style:italic !important;font-size:0.68rem !important}
.src-note{padding:10px 18px;font-size:0.56rem;color:rgba(255,255,255,0.18);line-height:1.6;
  border-top:1px solid rgba(255,255,255,0.05)}
.foot{padding:12px 18px 32px}
.go{display:block;width:100%;height:48px;background:#7D9E7E;color:#0A0B0A;
  border:none;font-size:0.75rem;font-weight:700;text-transform:uppercase;
  letter-spacing:0.08em;cursor:pointer}
.go:active{filter:brightness(1.2)}

.card-top-bar{position:sticky;top:0;z-index:2;background:#0d0d0d;
  display:flex;align-items:center;padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,0.06)}
.card-top-close{background:transparent;border:none;color:rgba(255,255,255,0.38);
  font-family:monospace;font-size:0.5rem;text-transform:uppercase;
  letter-spacing:0.08em;cursor:pointer;padding:4px 8px}
.card-top-close:active{color:#7D9E7E}

#dexOverlay{position:fixed;inset:0;z-index:30;background:#090b09;
  display:flex;flex-direction:column;overflow-y:auto}
#dexOverlay[hidden]{display:none}
.dex-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,0.07);position:sticky;top:0;
  background:#090b09;z-index:1;flex-shrink:0}
.dex-hd h2{font-family:monospace;font-size:0.62rem;text-transform:uppercase;
  letter-spacing:0.12em;color:rgba(255,255,255,0.3)}
.dex-cnt{font-size:0.82rem;font-weight:700;color:#7D9E7E}
.dex-cls{padding:12px 26px;background:transparent;border:1px solid rgba(255,255,255,0.18);
  color:rgba(255,255,255,0.55);font-family:monospace;font-size:0.78rem;
  text-transform:uppercase;cursor:pointer;letter-spacing:0.06em}
/* ── 쥬쥬랜드 마스터 오버레이 ── */
#masterOverlay{position:fixed;inset:0;z-index:35;background:#050806;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 24px;overflow:hidden}
#masterOverlay[hidden]{display:none}
.mo-glow{position:absolute;top:50%;left:50%;width:400px;height:400px;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle,rgba(212,255,0,0.14) 0%,transparent 65%);
  animation:moPulse 4s ease-in-out infinite}
@keyframes moPulse{0%,100%{opacity:0.55;transform:translate(-50%,-50%) scale(1)}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}
.mo-eyebrow{font-family:monospace;font-size:0.44rem;text-transform:uppercase;
  letter-spacing:0.22em;color:rgba(212,255,0,0.5);margin-bottom:24px;position:relative}
.mo-stars{font-size:1.4rem;letter-spacing:0.12em;color:#D4FF00;
  margin-bottom:18px;position:relative;
  text-shadow:0 0 24px rgba(212,255,0,0.55)}
.mo-zzl{display:block;font-family:monospace;font-size:0.62rem;letter-spacing:0.3em;
  color:rgba(212,255,0,0.55);text-transform:uppercase;margin-bottom:6px;position:relative}
.mo-title{font-size:clamp(3rem,13vw,5rem);font-weight:900;letter-spacing:-0.03em;
  line-height:1.05;color:#fff;margin-bottom:20px;position:relative}
.mo-divider{width:40px;height:2px;background:#D4FF00;margin:0 auto 16px;position:relative}
.mo-sub{font-family:monospace;font-size:0.54rem;color:rgba(255,255,255,0.3);
  letter-spacing:0.14em;text-transform:uppercase;margin-bottom:44px;position:relative}
.mo-btn{padding:14px 32px;border:1px solid rgba(212,255,0,0.45);background:transparent;
  color:#D4FF00;font-family:monospace;font-size:0.62rem;
  text-transform:uppercase;letter-spacing:0.1em;cursor:pointer;
  transition:background 0.2s;position:relative}
.mo-btn:active{background:rgba(212,255,0,0.12)}
/* 등장 애니메이션 */
@keyframes moIn{
  0%{opacity:0;transform:scale(0.93) translateY(20px)}
  65%{opacity:1;transform:scale(1.02) translateY(-3px)}
  100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes moChildIn{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}}
#masterOverlay.mo-enter{animation:moIn 0.85s cubic-bezier(0.22,0.61,0.36,1) both}
#masterOverlay.mo-enter .mo-eyebrow{animation:moChildIn 0.55s 0.15s cubic-bezier(0.22,0.61,0.36,1) both}
#masterOverlay.mo-enter .mo-stars{animation:moChildIn 0.55s 0.3s cubic-bezier(0.22,0.61,0.36,1) both}
#masterOverlay.mo-enter .mo-title{animation:moChildIn 0.6s 0.4s cubic-bezier(0.22,0.61,0.36,1) both}
#masterOverlay.mo-enter .mo-divider{animation:moChildIn 0.4s 0.65s cubic-bezier(0.22,0.61,0.36,1) both}
#masterOverlay.mo-enter .mo-sub{animation:moChildIn 0.4s 0.75s cubic-bezier(0.22,0.61,0.36,1) both}
#masterOverlay.mo-enter .mo-btn{animation:moChildIn 0.4s 0.9s cubic-bezier(0.22,0.61,0.36,1) both}

#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px}
@media(min-width:400px){#grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:520px){#grid{grid-template-columns:repeat(6,1fr)}}
.cell{background:#111;border:1px solid transparent;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.cell img{width:100%;aspect-ratio:1;object-fit:contain}
.cell b{font-size:0.52rem;text-align:center;color:rgba(255,255,255,0.65);line-height:1.3}
.cell u{font-size:0.42rem;color:rgba(255,255,255,0.18);font-family:monospace;text-decoration:none}
.cell.locked{opacity:0.3;filter:grayscale(1)}
.cell.locked b{color:rgba(255,255,255,0.2)}
.cell.new-unlock{animation:cellUnlock 0.7s cubic-bezier(0.22,0.61,0.36,1) forwards}
@keyframes cellUnlock{
  0%{transform:scale(0.6);opacity:0;filter:brightness(2)}
  60%{transform:scale(1.08);opacity:1;filter:brightness(1.4)}
  100%{transform:scale(1);opacity:1;filter:brightness(1)}}

#regAnim{position:fixed;inset:0;z-index:40;background:rgba(4,6,4,0.97);
  display:none;align-items:center;justify-content:center;flex-direction:column}
#regAnim.show{display:flex}
.reg-card{display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:cardAppear 0.55s cubic-bezier(0.22,0.61,0.36,1) forwards}
@keyframes cardAppear{
  0%{transform:scale(0.3) translateY(50px);opacity:0}
  100%{transform:scale(1) translateY(0);opacity:1}}
.reg-no{font-family:monospace;font-size:0.52rem;color:rgba(125,158,126,0.45);
  letter-spacing:0.18em;margin-bottom:4px}
.reg-img{width:170px;height:170px;display:flex;align-items:center;justify-content:center}
.reg-img img{width:100%;height:100%;object-fit:contain}
.reg-name{font-size:2rem;font-weight:700;letter-spacing:-0.02em;color:#fff}
.reg-ename{font-family:monospace;font-size:0.56rem;color:rgba(255,255,255,0.25);
  text-transform:uppercase;letter-spacing:0.1em}
.reg-prog{font-family:monospace;font-size:0.56rem;color:rgba(125,158,126,0.5);
  letter-spacing:0.1em;opacity:0;animation:fIn 0.4s 1.05s forwards}
@keyframes fIn{to{opacity:1}}

#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:50;
  max-width:92vw;padding:9px 18px;background:rgba(10,12,10,0.92);
  border:1px solid rgba(125,158,126,0.28);color:#7D9E7E;font-size:0.7rem;
  text-align:center;pointer-events:none;opacity:0;transition:opacity 0.22s;white-space:nowrap}
#toast.on{opacity:1}
  </style>
</head>
<body>

<div id="mapDiv"></div>
<a href="/" class="ov-back">← HOME</a>
<button id="dexBtn">도감 0/62</button>

<div id="gpsBar" class="gps-pill">
  <div class="gps-dot"></div>
  <span id="gpsBarText">위치 확인 중…</span>
</div>

<div id="zoneBadge"></div>

<div class="zoom-btns">
  <button class="zoom-btn" id="zoomInBtn">+</button>
  <button class="zoom-btn" id="zoomOutBtn">−</button>
</div>

<div id="testPanel">
  <button data-lon="126.8551391" data-lat="37.6900442">파충류 빌리지</button>
  <button data-lon="126.8552881" data-lat="37.6897889">대동물 방목장</button>
  <button data-lon="126.8550938" data-lat="37.6911538">거북이카페</button>
  <button data-lon="126.8553185" data-lat="37.6903786">오솔길</button>
  <button data-lon="126.8547149" data-lat="37.6906056">악어 빌리지</button>
  <button data-lon="126.8544686" data-lat="37.6903647">호숫가</button>
  <button data-lon="126.8548843" data-lat="37.6915665">양 분유</button>
  <button data-lon="126.8552734" data-lat="37.6902112">사랑새</button>
  <button data-lon="126.8548195" data-lat="37.6897747">기타</button>
  <button data-lon="126.8544674" data-lat="37.6912988">알파카</button>
  <button data-lon="126.8547835" data-lat="37.6913813">원숭이</button>
  <button data-lon="126.8548991" data-lat="37.6914150">거북이방사장</button>
</div>

<div id="modal" hidden><div id="sheet"></div></div>

<div id="dexOverlay" hidden>
  <div class="dex-hd">
    <h2>동물도감</h2>
    <span class="dex-cnt" id="dexCnt">0 / 62</span>
    <button class="dex-cls" id="dexClsBtn">닫기</button>
  </div>
  <div id="grid"></div>
</div>

<div id="masterOverlay" hidden>
  <div class="mo-glow"></div>
  <div class="mo-eyebrow">ALL 62 SPECIES CLEARED</div>
  <div class="mo-stars">★★★★★</div>
  <span class="mo-zzl">ZZL</span>
  <h1 class="mo-title">쥬쥬랜드<br>마스터</h1>
  <div class="mo-divider"></div>
  <p class="mo-sub">62종 완전 수집 달성</p>
  <button id="masterDismiss" class="mo-btn">도감 보기 ↓</button>
</div>

<div id="regAnim"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="dogam/zzl-parts.js"></script>
<script src="dogam/zzl-species.js"></script>
<script src="dogam/zzl-species2.js"></script>
<script src="dogam/zzl-dex-app.js"></script>
<script src="dogam/zzl-info.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   쥬쥬랜드 동물도감 v2  |  가이드맵 GPS 연동 버전
   실제 guidemap.png 위에 동물 블록이 GPS 좌표에 등장
   동물 이름 먼저 공개 → 조각 퍼즐 → 도감 등록 애니메이션
═══════════════════════════════════════════════════════════ */
var SP=ZZL_SPECIES, S=ZDX.save, SND=ZDX.sound;
function $(id){return document.getElementById(id);}

/* ── GCP + 어파인 변환 ──────────────────────────────── */
var GCPs=[
  [126.8538597,37.6903466,2487,2054],[126.8540339,37.6902809,2510,1839],
  [126.8535053,37.6898443,3273,2218],[126.8543281,37.689641, 3258,1219],
  [126.8537643,37.6902084,2694,2096],[126.8541615,37.690084, 2718,1637],
  [126.8543509,37.6899381,2838,1380],[126.8549816,37.6897766,2835, 664],

var AFFINE_LON0,AFFINE_LAT0;
function computeAffine(g){
  var sLon=0,sLat=0;
  for(var i=0;i<g.length;i++){sLon+=g[i][0];sLat+=g[i][1];}
  AFFINE_LON0=sLon/g.length; AFFINE_LAT0=sLat/g.length;
  var n=g.length,A=[],bx=[],by=[];
  for(var i=0;i<n;i++){A.push([g[i][0]-AFFINE_LON0,g[i][1]-AFFINE_LAT0,1]);bx.push(g[i][2]);by.push(g[i][3]);}
  function ls(rows,rhs){
    var AtA=[[0,0,0],[0,0,0],[0,0,0]],Atb=[0,0,0];
    for(var i=0;i<rows.length;i++){for(var j=0;j<3;j++){Atb[j]+=rows[i][j]*rhs[i];for(var k=0;k<3;k++)AtA[j][k]+=rows[i][j]*rows[i][k];}}
    function inv(m){var a=m[0][0],b=m[0][1],c=m[0][2],d=m[1][0],e=m[1][1],f=m[1][2],gg=m[2][0],h=m[2][1],ii=m[2][2];
      var dt=a*(e*ii-f*h)-b*(d*ii-f*gg)+c*(d*h-e*gg);
      return [[(e*ii-f*h)/dt,(c*h-b*ii)/dt,(b*f-c*e)/dt],[(f*gg-d*ii)/dt,(a*ii-c*gg)/dt,(c*d-a*f)/dt],[(d*h-e*gg)/dt,(b*gg-a*h)/dt,(a*e-b*d)/dt]];}
    var inv_=inv(AtA),res=[0,0,0];
    for(var i=0;i<3;i++)for(var j=0;j<3;j++)res[i]+=inv_[i][j]*Atb[j];
    return res;
  }
  var rx=ls(A,bx),ry=ls(A,by);
  return{a:rx[0],b:rx[1],c:rx[2],d:ry[0],e:ry[1],f:ry[2]};
}
var affine=computeAffine(GCPs);
var IMG_W=4492,IMG_H=3176,leafBounds=[[0,0],[IMG_H,IMG_W]];
function gpsToNaturalPx(lng,lat){return{x:affine.a*(lng-AFFINE_LON0)+affine.b*(lat-AFFINE_LAT0)+affine.c,y:affine.d*(lng-AFFINE_LON0)+affine.e*(lat-AFFINE_LAT0)+affine.f};}
function px2ll(nx,ny){return L.latLng(IMG_H-ny,nx);}
function gpsToLeaflet(lng,lat){var p=gpsToNaturalPx(lng,lat);return px2ll(p.x,p.y);}

var lmap=L.map('mapDiv',{crs:L.CRS.Simple,minZoom:-5,maxZoom:4,

lmap.fitBounds(leafBounds,{animate:false});

var accCircle=L.circle([IMG_H/2,IMG_W/2],{radius:0,fillColor:'#7D9E7E',fillOpacity:0.07,
  color:'#7D9E7E',opacity:0,weight:1.5,interactive:false}).addTo(lmap);

function makeGpsIcon(z){var s=iconSz(z);return L.divIcon({className:'gps-icon',

gpsMarker.setOpacity(0);
lmap.on('zoomend',function(){gpsMarker.setIcon(makeGpsIcon(lmap.getZoom()));});
function accPx(m){return m*Math.abs(affine.e)/111000;}
function placeGPS(nx,ny,acc){var ll=px2ll(nx,ny);gpsMarker.setLatLng(ll).setOpacity(1);
  accCircle.setLatLng(ll).setRadius(accPx(acc)).setStyle({opacity:0.18,fillOpacity:0.07});}
function clearGPS(){gpsMarker.setOpacity(0);accCircle.setStyle({opacity:0,fillOpacity:0});}

/* ── GPS 상태 ────────────────────────────────────── */
var gpsBar=$('gpsBar'),gpsBarText=$('gpsBarText');
function setStatus(s,t){gpsBar.className='gps-pill '+s;gpsBarText.textContent=t;}
var PARK={latMin:37.688,latMax:37.693,lngMin:126.852,lngMax:126.857};
function inPark(lng,lat){return lng>=PARK.lngMin&&lng<=PARK.lngMax&&lat>=PARK.latMin&&lat<=PARK.latMax;}
var curLon=null,curLat=null,testOverride=false;
if('geolocation' in navigator){
  setStatus('finding','위치 확인 중…');
  navigator.geolocation.watchPosition(
    function(pos){
      if(testOverride)return;
      var lng=pos.coords.longitude,lat=pos.coords.latitude,acc=pos.coords.accuracy;
      if(!inPark(lng,lat)){clearGPS();setStatus('outside','쥬쥬랜드 밖');return;}
      var p=gpsToNaturalPx(lng,lat);placeGPS(p.x,p.y,acc);
      setStatus('found','정확도 '+Math.round(acc)+'m');
      if(curLon===null)lmap.panTo(px2ll(p.x,p.y));
      curLon=lng;curLat=lat;recompute(lng,lat);
    },
    function(err){setStatus('error',(['','위치 권한 거부','위치 불명','시간 초과'][err.code]||'위치 오류'));},
    {enableHighAccuracy:true,maximumAge:5000,timeout:30000}
  );
}else{setStatus('error','위치 미지원');}

/* ── 구역 감지 ───────────────────────────────────── */
var inZones=[],zoneBadge=$('zoneBadge');
function recompute(lng,lat){
  var was=inZones.slice();
  inZones=ZDX.zones.filter(function(z){return ZDX.dist(lng,lat,z.lon,z.lat)<=ZDX.RADIUS;}).map(function(z){return z.name;});
  inZones.forEach(function(n){if(was.indexOf(n)<0){SND.zone();toast(n+' 구역에 도착했어요');}});
  if(pendingAnimal&&pendingZone&&inZones.length>0&&inZones.indexOf(pendingZone)<0){
    removeAnimalMarker(pendingId);
  }
  if(inZones.length){zoneBadge.textContent=inZones.join(' · ');zoneBadge.classList.add('on');}
  else zoneBadge.classList.remove('on');
  tryEncounter();
}

/* ── 동물 마커 ───────────────────────────────────── */
var animalMarkers={},pendingAnimal=false,pendingId=null,pendingZone=null;
function spawnAnimal(spec){
  if(pendingAnimal)return;
  if(animalMarkers[spec.id])return;
  var zone=ZDX.zones.filter(function(z){return z.name===spec.zone;})[0];
  if(!zone)return;
  var img=ZDX.thumbs.species(spec,false);
  var icon=L.divIcon({
    className:'animal-pin',
    html:'<div class="animal-pin-label">'+spec.kname+'</div><img src="'+img+'" alt="'+spec.kname+'">',
    iconSize:[88,88],iconAnchor:[44,88]
  });
  var rawP=gpsToNaturalPx(zone.lon,zone.lat);
  var cnx=Math.max(80,Math.min(IMG_W-80,rawP.x));
  var cny=Math.max(80,Math.min(IMG_H-80,rawP.y));
  var ll=px2ll(cnx,cny);
  var m=L.marker(ll,{icon:icon,zIndexOffset:500}).addTo(lmap);
  m.on('click',function(){SND.unlock();openEncounter(spec);});
  animalMarkers[spec.id]=m;
  pendingAnimal=true;
  pendingId=spec.id;
  pendingZone=spec.zone;
  lmap.panTo(ll);
  SND.pop();
  toast(spec.kname+'가 나타났어요! 탭해서 잡아보세요 👆');
}
function removeAnimalMarker(id){
  if(animalMarkers[id]){animalMarkers[id].remove();delete animalMarkers[id];}
  pendingAnimal=false;pendingId=null;pendingZone=null;
}

/* ── 조우 타이머 ─────────────────────────────────── */
var busy=false,timers={};
function tryEncounter(){
  if(busy||!inZones.length)return;
  for(var i=0;i<inZones.length;i++){
    var zn=inZones[i];
    if(!ZDX.encounter.ready(zn))continue;
    var pick=ZDX.encounter.pick(zn,SP);
    if(!pick)continue;
    ZDX.encounter.arm(zn);spawnAnimal(pick);return;
  }
}
setInterval(function(){if(!busy)tryEncounter();},2000);

var cv=document.createElement('canvas');
var R3=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R3.setPixelRatio(Math.min(window.devicePixelRatio,2));
if(THREE.sRGBEncoding)R3.outputEncoding=THREE.sRGBEncoding;
var sc=new THREE.Scene();
sc.add(new THREE.HemisphereLight(0xE8F2F6,0x8E8560,.95));
var kl=new THREE.DirectionalLight(0xFFF8E8,1.02);kl.position.set(5,9,6);sc.add(kl);
var rl=new THREE.DirectionalLight(0xC6DCFF,.36);rl.position.set(-5,3,-4);sc.add(rl);
var pod=new THREE.Group();
pod.add(new THREE.Mesh(new THREE.CylinderGeometry(3.05,3.25,.34,26),
  new THREE.MeshStandardMaterial({color:0xC9CBA8,roughness:.94,flatShading:true})));
pod.children[0].position.y=-.17;sc.add(pod);
var cam3=new THREE.PerspectiveCamera(34,1,.1,120);
var cur=null,curA=null,rotY=-.55,rotT=-.55,vel=0,drag=false,lastX=0,idle3=0;

function show3D(spec,playAnim){
  if(cur)sc.remove(cur.root);
  cur=ZZL.build(spec.model);sc.add(cur.root);
  curA=ZZL.assembly(cur,{
    onLand:function(){SND.snap();},
    onComplete:function(){var f=$('flash');if(f){f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}SND.build();}
  });
  rotY=rotT=-.55;vel=0;
  pod.scale.setScalar(Math.max(cur.footR*1.45,1.2)/3.05);
  fit3D();if(playAnim)curA.play();return cur;
}
function fit3D(){
  if(!cur)return;
  var w=cv.clientWidth||300,h=cv.clientHeight||260;
  R3.setSize(w,h,false);cam3.aspect=w/h;cam3.updateProjectionMatrix();
  var hh=cur.size.y*1.5,ww=Math.max(cur.size.x*1.2,(cur.footR*1.45)*2.1);
  var vF=cam3.fov*Math.PI/180,hF=2*Math.atan(Math.tan(vF/2)*cam3.aspect);
  var d=Math.max((hh/2)/Math.tan(vF/2),(ww/2)/Math.tan(hF/2));
  cam3.position.set(0,cur.center.y+cur.size.y*.26,d);cam3.lookAt(0,cur.center.y,0);
}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);drag=true;lastX=e.clientX;vel=0;});
cv.addEventListener('pointermove',function(e){if(!drag)return;var d=e.clientX-lastX;lastX=e.clientX;rotT+=d*.011;vel=d*.011;idle3=performance.now();});
cv.addEventListener('pointerup',function(){drag=false;idle3=performance.now();});
var clk=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  if(!cur||!cv.parentNode)return;
  var t=clk.getElapsedTime(),now=performance.now();
  if(!drag){rotT+=vel;vel*=.93;if(now-idle3>2600)rotT+=.0032;}
  rotY+=(rotT-rotY)*.16;
  cur.update(t);if(curA&&!curA.done)curA.update(now);
  cur.root.rotation.y=rotY;pod.rotation.y=rotY*.12;
  R3.render(sc,cam3);
})();

/* ── 조우 → 퍼즐 ──────────────────────────────── */
function openEncounter(spec){
  removeAnimalMarker(spec.id);
  busy=true;SND.pop();
  var steps=ZDX.puzzle.make(spec,SP);
  var step=0,misses=0,reduced=false;

  var silSrc=ZDX.thumbs.species(spec,true);
  function render(){
    var st=steps[step];
    openSheet(
      '<div class="stage" id="stg"><div class="stag">'+spec.zone+'</div><img class="sil-img" src="'+silSrc+'"></div>'
      +'<div class="quiz-panel">'
      +'<div class="qhead">'
      +'<b class="kname-big">'+(step===0?spec.kname+'가 나타났어요!':'좋아요, 계속!')+'</b>'
      +'<span>'+(step+1)+' / '+steps.length+'</span>'
      +'</div>'
      +'<div class="qtip">눈앞의 동물을 보고 <b>'+PNAME(st.part)+'</b> 조각을 골라주세요.</div>'
      +'<div class="opts" id="opts"></div>'
      +'<div class="qbar"><button class="x" id="qx">나중에</button></div>'
      +'</div>'
    );
    var wrap=$('opts');
    st.options.forEach(function(o){
      var b=document.createElement('button');b.className='opt';
      var img=document.createElement('img');
      img.src=ZDX.thumbs.part(o.spec,o.part)||ZDX.thumbs.species(o.spec,true);
      b.appendChild(img);
      b.onclick=function(){
        if(o.ok){
          b.classList.add('yes');SND.snap();step++;
          if(step>=steps.length)setTimeout(finish,260);else setTimeout(render,260);
        }else{
          misses++;SND.miss();b.classList.remove('no');void b.offsetWidth;b.classList.add('no');
          if(misses===2)toast('힌트: 주변 안내판을 확인해보세요');
          if(misses>=3)toast(spec.zone+' 안내판을 찾아보세요');
        }
      };
      wrap.appendChild(b);
    });
    $('qx').onclick=function(){closeModal();};
  }

  function finish(){
    S.add(spec.id);
    var info=(window.ZZL_INFO&&ZZL_INFO[spec.id])||{};
    var eco=info.eco?'<dd>'+info.eco+'</dd>':'<dd class="pend">출처 확인 후 공개됩니다</dd>';
    var iucn=info.iucn?'<dd>'+info.iucn+'</dd>':'<dd class="pend">출처 확인 후 공개됩니다</dd>';
    var sname=info.sname?'<dd><em>'+info.sname+'</em></dd>':'<dd class="pend">—</dd>';

    /* Phase 1: 조립 애니메이션 — 스테이지가 전체화면 차지, 캔버스는 수직 중앙 정렬 */
    openSheet('<div class="stage stage-full" id="stg"><div class="stag">'+spec.zone+'</div><div class="flash" id="flash"></div></div>');
    $('stg').appendChild(cv);
    if(cur)sc.remove(cur.root);
    cur=ZZL.build(spec.model); sc.add(cur.root);
    rotY=rotT=-.55; vel=0;
    pod.scale.setScalar(Math.max(cur.footR*1.45,1.2)/3.05);
    curA=ZZL.assembly(cur,{
      onLand:function(){SND.snap();},
      onComplete:function(){
        var f=$('flash');
        if(f){f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}
        SND.build();
        /* Phase 2: 조립 완료 → 동물 설명과 함께 표시, 닫기 버튼 없이 3초 후 자동 전환 */
        setTimeout(function(){
          $('sheet').innerHTML=
            '<div class="stage" id="stg"><div class="stag">'+spec.zone+'</div><div class="flash" id="flash"></div></div>'
            +'<div class="body">'
            +'<div class="nameline"><span class="kname">'+spec.kname+'</span><span class="ename">'+spec.ename.toUpperCase()+'</span></div>'
            +'<div class="meta">'
            +'<span class="chip z">'+spec.zone+'</span>'
            +'<span class="chip">'+spec.n+'마리</span>'
            +'</div>'
            +'<dl class="rows">'
            +'<div class="row"><dt>학명</dt>'+sname+'</div>'
            +'<div class="row"><dt>관찰 포인트</dt><dd>'+spec.tell+'</dd></div>'
            +'<div class="row"><dt>헷갈리는 친구</dt><dd>'+((spec.rivals||[]).join(' · ')||'없음')+'</dd></div>'
            +'<div class="row"><dt>생태</dt>'+eco+'</div>'
            +'<div class="row"><dt>CITES 등재</dt>'+iucn+'</div>'
            +'</dl>'
            +'</div>'
            +'<p class="src-note">생태·보전 항목은 1차 출처 확인 전 공개 보류 / 사육사 감수 예정</p>';
          $('stg').appendChild(cv);
          fit3D();
          /* 3초 후 도감으로 자동 전환 */
          setTimeout(function(){
            $('modal').hidden=true;$('sheet').innerHTML='';
            playRegistration(spec,function(){busy=false;updateProgress();showDex(spec.id);});
          },3000);
        },700);
      }
    });
    fit3D(); setTimeout(fit3D,0);
    curA.play();
  }
  render();
}

$('masterDismiss').onclick=function(){$('masterOverlay').hidden=true;};
$('dexBtn').onclick=function(){SND.unlock();showDex();};
$('dexClsBtn').onclick=function(){
  if(history.state&&history.state.dexOpen){history.back();}
  else{hideDex();}
};
window.addEventListener('popstate',function(e){
  if(!$('dexOverlay').hidden&&!(e.state&&e.state.dexOpen)){hideDex();}
});
if(location.hash==='#dex'){setTimeout(function(){showDex();},600);}
function showDex(newId){
  drawGrid(newId);
  $('dexOverlay').hidden=false;
  /* 62종 완전 수집 시 마스터 오버레이 표시 */
  if(S.count()===SP.length&&SP.length>0){showMaster();}
  else{$('masterOverlay').hidden=true;}
  if(!history.state||!history.state.dexOpen){
    history.pushState({dexOpen:true},'','#dex');
  }
}
function drawGrid(newId){
  var el=$('grid');el.innerHTML='';
  SP.forEach(function(s){
    var has=S.has(s.id);
    var isNew=s.id===newId;
    var b=document.createElement('button');
    b.className='cell'+(has?'':' locked')+(isNew?' new-unlock':'');
    var img=document.createElement('img');img.loading='lazy';b.appendChild(img);
    var nm=document.createElement('b');nm.textContent=has?s.kname:'???';b.appendChild(nm);
    var no=document.createElement('u');no.textContent=s.id.slice(1);b.appendChild(no);
    var io=new IntersectionObserver(function(en){if(en[0].isIntersecting){img.src=ZDX.thumbs.species(s,!has);io.disconnect();}});
    io.observe(b);
    if(has)b.onclick=function(){$('dexOverlay').hidden=true;openCard(s,false);};
    el.appendChild(b);
    if(isNew)setTimeout(function(){b.scrollIntoView({behavior:'smooth',block:'center'});},120);
  });
}

/* ── 줌 / 테스트 ─────────────────────────────── */
$('zoomInBtn').onclick=function(){lmap.zoomIn();};
$('zoomOutBtn').onclick=function(){lmap.zoomOut();};

var TEST=new URLSearchParams(location.search).has('test');
if(TEST){
  var tp=$('testPanel');tp.style.display='flex';
  setStatus('outside','TEST MODE — 구역 선택');
  var activeT=null;
  tp.querySelectorAll('button').forEach(function(btn){
    btn.onclick=function(){
      SND.unlock();testOverride=true;
      var lng=parseFloat(btn.dataset.lon),lat=parseFloat(btn.dataset.lat);
      var p=gpsToNaturalPx(lng,lat);
      placeGPS(p.x,p.y,8);setStatus('found','TEST · '+btn.textContent);
      lmap.panTo(px2ll(p.x,p.y));
      if(activeT)activeT.classList.remove('active');btn.classList.add('active');activeT=btn;
      curLon=lng;curLat=lat;recompute(lng,lat);
    };
  });
}

updateProgress();
</script>
