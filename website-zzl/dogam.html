<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쥬쥬랜드 동물도감</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --moss:#2A3B31; --moss-deep:#1D2A22;
    --paper:#F7F1E1; --paper-edge:#E7DEC7;
    --ink:#1C2620; --sage:#8C9C87; --injoo:#D63B2A;
    --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
    --mono:'SF Mono','Consolas','D2Coding',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%,#35493C 0%,var(--moss) 45%,var(--moss-deep) 100%);
    font-family:var(--font);color:var(--paper);
    display:flex;align-items:flex-start;justify-content:center;
    padding:calc(10px + env(safe-area-inset-top)) 13px calc(20px + env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-font-smoothing:antialiased;
  }
  .shell{width:100%;max-width:400px}

  .top{display:flex;align-items:center;gap:8px;padding:0 2px 9px}
  .top b{font-size:12px;font-weight:800;letter-spacing:.14em;flex:1}
  .top .prog{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sage)}
  .icb{width:30px;height:30px;border:1px solid rgba(247,241,225,.22);background:transparent;
    border-radius:8px;color:rgba(247,241,225,.7);font-size:13px;cursor:pointer;flex:none}
  .icb[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

  .tabs{display:flex;gap:3px;background:rgba(247,241,225,.1);border-radius:12px;padding:3px;margin-bottom:10px}
  .tabs button{flex:1;border:none;background:transparent;border-radius:9px;cursor:pointer;
    font-family:var(--font);font-size:12.5px;font-weight:700;padding:9px 0;color:rgba(247,241,225,.6)}
  .tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

  .card{position:relative;background:var(--paper);color:var(--ink);border-radius:18px;
    box-shadow:0 1px 0 #fff inset,0 18px 40px -18px rgba(0,0,0,.65),0 2px 0 var(--paper-edge);
    overflow:hidden}
  .pane[hidden]{display:none}

  /* ── 지도 ── */
  .mapwrap{position:relative;aspect-ratio:1/1.02;max-height:min(52vh,380px);
    background:linear-gradient(180deg,#CFE2D2 0%,#DFE6D0 60%,#EBE4CE 100%);
    border-bottom:1px solid var(--paper-edge);overflow:hidden}
  .mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
  .zoneC{fill:rgba(90,130,90,.13);stroke:#7E9478;stroke-width:1;stroke-dasharray:3 3}
  .zoneC.in{fill:rgba(214,59,42,.14);stroke:var(--injoo);stroke-dasharray:none;stroke-width:1.6}
  .zoneDot{fill:#5C6D5C}
  .zoneDot.in{fill:var(--injoo)}
  .zoneT{font-family:var(--font);font-size:8.5px;font-weight:700;fill:#48583F}
  .zoneT.in{fill:var(--injoo)}
  .zoneN{font-family:var(--mono);font-size:7.5px;fill:#7E8C78}
  .me{fill:#2C6BD6;stroke:#fff;stroke-width:2}
  .meR{fill:rgba(44,107,214,.16);stroke:rgba(44,107,214,.4);stroke-width:1}

  .gpsbar{padding:11px 15px;display:flex;align-items:center;gap:9px;
    border-bottom:1px solid var(--paper-edge)}
  .gpsbar .dot{width:7px;height:7px;border-radius:50%;background:#B4B4A2;flex:none}
  .gpsbar .dot.on{background:#3E9E52}
  .gpsbar span{font-size:11.5px;color:#4A5748;flex:1;line-height:1.4}
  .gpsbar button{border:1px solid var(--paper-edge);background:transparent;border-radius:8px;
    cursor:pointer;font-family:var(--font);font-size:11px;font-weight:700;padding:6px 10px;color:#4A5748}

  .zlist{padding:11px 13px 15px;display:flex;flex-wrap:wrap;gap:5px}
  .zlist button{border:1px solid var(--paper-edge);background:transparent;border-radius:9px;
    cursor:pointer;font-family:var(--font);font-size:10.5px;font-weight:700;padding:6px 8px;color:#5C6D5C}
  .zlist button.here{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .zlist button.done{opacity:.45}
  .zlist button i{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.7;margin-left:3px}

  /* ── 도감 ── */
  .dexhead{padding:14px 16px 0;display:flex;align-items:baseline;gap:8px}
  .dexhead h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .dexhead span{font-family:var(--mono);font-size:10px;color:var(--sage);letter-spacing:.1em}
  .meter{margin:11px 16px 0;height:6px;border-radius:99px;background:#E5DFC9;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .5s}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:13px 14px 16px}
  .cell{position:relative;aspect-ratio:1/1.12;border:1px solid var(--paper-edge);border-radius:10px;
    background:#FBF7EC;cursor:pointer;overflow:hidden;padding:0}
  .cell img{width:100%;height:72%;object-fit:contain;display:block}
  .cell b{display:block;font-size:8.5px;font-weight:700;color:#42513F;line-height:1.1;
    padding:0 2px;word-break:keep-all;overflow:hidden}
  .cell.locked{background:#F0EBDC}
  .cell.locked b{color:#B0AC9A}
  .cell u{position:absolute;top:3px;right:4px;font-family:var(--mono);font-size:7px;
    text-decoration:none;color:var(--sage)}
  .cell .gr{position:absolute;top:3px;left:4px;width:7px;height:7px;border-radius:50%}
  .gr.골드{background:#D6A72B}.gr.실버{background:#A8ADB4}.gr.브론즈{background:#B07A4A}

  /* ── 상세/조우 모달 ── */
  .modal{position:fixed;inset:0;background:rgba(20,28,22,.7);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
  .modal[hidden]{display:none}
  .sheet{width:100%;max-width:380px;background:var(--paper);color:var(--ink);border-radius:18px;
    overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.8);max-height:92vh;overflow-y:auto}
  .stage{position:relative;aspect-ratio:1/.82;max-height:min(38vh,270px);
    background:linear-gradient(180deg,#D3E3EA 0%,#DFE7DD 58%,#EDE7D6 100%)}
  .stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .flash.on{animation:fl .5s ease-out}
  @keyframes fl{0%{opacity:.6}100%{opacity:0}}
  .stag{position:absolute;top:11px;left:13px;font-family:var(--mono);font-size:10px;
    letter-spacing:.16em;color:#5C6D5C}
  .sil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .sil img{width:64%;filter:brightness(0) opacity(.22)}

  .body{padding:15px 17px 6px}
  .nameline{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
  .kname{font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:.98}
  .ename{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--sage);padding-bottom:4px}
  .meta{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .chip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#E5E0CC;color:#4C5A48}
  .chip.z{background:#DCE7D5;color:#42604A}
  .chip.g{background:#F0E3C0;color:#7A5E18}
  .rows{margin-top:12px;border-top:1px solid var(--paper-edge)}
  .row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--paper-edge);align-items:baseline}
  .row dt{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--sage)}
  .row dd{font-size:12.5px;line-height:1.5;color:#33402F;word-break:keep-all}
  .pend{color:#9A9484;font-style:italic}
  .src{padding:9px 17px 0;font-size:9.5px;line-height:1.5;color:#9A9484}

  /* ── 퍼즐 ── */
  .qhead{padding:13px 17px 0;display:flex;align-items:baseline;gap:8px}
  .qhead b{font-size:14px;font-weight:800;flex:1}
  .qhead span{font-family:var(--mono);font-size:10px;color:var(--sage)}
  .qtip{padding:7px 17px 0;font-size:11.5px;color:#5C6A58;line-height:1.5;word-break:keep-all}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px 15px 4px}
  .opt{aspect-ratio:1/1;border:1px solid var(--paper-edge);border-radius:12px;background:#FBF7EC;
    cursor:pointer;padding:3px;overflow:hidden}
  .opt img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .opt.no{animation:shake .3s}
  .opt.yes{border-color:#3E9E52;background:#E6F2E4}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .qbar{display:flex;gap:7px;padding:12px 15px 16px;align-items:center}
  .qbar button{border:1px solid var(--paper-edge);background:transparent;border-radius:10px;
    cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700;padding:11px 12px;color:#5C6D5C}
  .qbar .x{flex:none}
  .qbar .e{flex:1}
  .go{width:100%;height:46px;border:none;border-radius:11px;cursor:pointer;background:var(--ink);
    color:var(--paper);font-family:var(--font);font-size:13.5px;font-weight:700}
  .foot{padding:14px 17px 18px}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);background:var(--ink);color:var(--paper);padding:11px 17px;
    border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;
    transition:opacity .3s,transform .3s;box-shadow:0 10px 24px -10px rgba(0,0,0,.7);z-index:40}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .note{padding:2px 4px 0;text-align:center;font-family:var(--mono);font-size:9px;
    letter-spacing:.12em;color:var(--sage);line-height:1.7}
  :focus-visible{outline:2px solid var(--injoo);outline-offset:3px}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <a href="/" style="color:var(--sage);font-size:10px;font-family:var(--mono);text-decoration:none;flex:none;letter-spacing:.08em">← HOME</a>
    <b style="flex:1;text-align:center">쥬쥬랜드 동물도감</b>
    <span class="prog" id="prog">0 / 62</span>
    <button class="icb" id="bSfx" aria-pressed="true" title="효과음">♪</button>
    <button class="icb" id="bBgm" aria-pressed="false" title="배경음">♫</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-v="0" aria-pressed="true">지도</button>
    <button data-v="1" aria-pressed="false">도감</button>
  </div>

  <!-- 지도 -->
  <section class="pane" id="paneMap">
    <div class="card">
      <div class="mapwrap"><svg id="map" viewBox="0 0 300 306"></svg></div>
      <div class="gpsbar">
        <i class="dot" id="gdot"></i>
        <span id="gtxt">위치 확인 전</span>
        <button id="gbtn">위치 켜기</button>
      </div>
      <div class="zlist" id="zlist"></div>
    </div>
    <div class="note" id="note1"></div>
  </section>

  <!-- 도감 -->
  <section class="pane" id="paneDex" hidden>
    <div class="card">
      <div class="dexhead"><h2 id="dexN">0종 수집</h2><span id="dexS"></span></div>
      <div class="meter"><i id="dexBar" style="width:0%"></i></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="note" id="note2"></div>
  </section>
</div>

<!-- 모달 -->
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ZZL BLOCK PARTS LIBRARY  v1.0
   쥬쥬랜드 동물도감 · 레고 블록형 3D 부품 라이브러리

   의존: three.js r128 (전역 THREE)
   사용: const model = ZZL.build(spec);  scene.add(model.root);

   설계 원칙
   - 모든 동물은 이 파일의 부품 조합으로만 만든다
   - 부품은 상자·원기둥·원뿔만 사용 (레고 호환 형태)
   - 종 구분은 색이 아니라 형태를 1순위로 한다
   - 각 부품은 정면 렌더 PNG로 뽑아 퍼즐 선택지에 그대로 쓴다
   ============================================================ */
(function (global) {
'use strict';

var ZZL = {};

/* ── 재질 ────────────────────────────────────────── */
var _matCache = {};
function mat(color) {
  if (!_matCache[color]) {
    _matCache[color] = new THREE.MeshStandardMaterial({
      color: color, roughness: 0.34, metalness: 0
    });
  }
  return _matCache[color];
}
ZZL.mat = mat;

/* ── 기본 도형 ───────────────────────────────────── */
function box(w, h, d, color, x, y, z) {
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, color, x, y, z, seg) {
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 10), mat(color));
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cone(r, h, color, x, y, z, seg) {
  var m = new THREE.Mesh(new THREE.ConeGeometry(r, h, seg || 6), mat(color));
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = m.receiveShadow = true;
  return m;
}
ZZL.box = box; ZZL.cyl = cyl; ZZL.cone = cone;

/* ── 레고 돌기(스터드) ───────────────────────────── */
function studs(parent, color, cols, rows, gapX, gapZ, y, z0, r) {
  r = r || 0.17;
  var g = new THREE.CylinderGeometry(r, r, 0.13, 10);
  for (var i = 0; i < cols; i++) for (var j = 0; j < rows; j++) {
    var m = new THREE.Mesh(g, mat(color));
    m.position.set((i - (cols - 1) / 2) * gapX, y, (z0 || 0) + (j - (rows - 1) / 2) * gapZ);
    m.castShadow = m.receiveShadow = true;
    parent.add(m);
  }
}
ZZL.studs = studs;

/* ── 눈 (픽셀형 · 블록 캐릭터 표준) ──────────────── */
function pixEye(size, dark) {
  var g = new THREE.Group();
  var w = box(size, size, 0.08, 0xFFFFFF);
  var p = box(size * 0.5, size * 0.62, 0.09, dark || 0x1A1E20, 0, 0, 0.02);
  g.add(w, p);
  g.userData.white = w;
  return g;
}
ZZL.pixEye = pixEye;

/* ============================================================
   PARTS — 부위별 부품
   각 함수는 THREE.Group을 돌려주며, 원점은 부착 지점(소켓)이다.
   ============================================================ */
var PARTS = {};

/* ── 몸통 ────────────────────────────────────────── */
PARTS.body = {
  /* 4족 보행형: 알파카·사슴·염소·라쿤 등 */
  quad: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    if (o.belly) g.add(box(o.w * 0.9, o.h * 0.2, o.d * 0.9, o.belly, 0, -o.h / 2 + 0.02, 0));
    if (o.studs !== false) studs(g, o.dark || o.color, o.sc || 2, o.sr || 3, o.w * 0.4, o.d * 0.3, o.h / 2 + 0.06, 0);
    return g;
  },
  /* 직립형: 미어캣·프레리독 */
  upright: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    if (o.belly) g.add(box(o.w * 0.7, o.h * 0.7, 0.12, o.belly, 0, -o.h * 0.05, o.d / 2 + 0.01));
    return g;
  },
  /* 조류형: 앵무·에뮤 */
  bird: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    if (o.belly) g.add(box(o.w * 0.75, o.h * 0.8, 0.14, o.belly, 0, -o.h * 0.04, o.d / 2 + 0.01));
    return g;
  },
  /* 납작 장동형: 악어·도마뱀 */
  lowLong: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    if (o.belly) g.add(box(o.w * 0.9, o.h * 0.25, o.d * 0.9, o.belly, 0, -o.h / 2 + 0.03, 0));
    if (o.crest) for (var i = 0; i < 5; i++)
      g.add(box(0.12, 0.2 - i * 0.02, 0.12, o.crest, 0, o.h / 2 + 0.09, o.d * 0.3 - i * (o.d * 0.17)));
    if (o.studs) studs(g, o.dark || o.color, 1, 3, 0, o.d * 0.28, o.h / 2 + 0.06, 0);
    return g;
  },
  /* 등딱지형: 거북 */
  shell: function (o) {
    var g = new THREE.Group();
    var dome = cyl(o.w * 0.42, o.w * 0.5, o.h, o.color, 0, 0, 0, o.seg || 8);
    g.add(dome);
    g.add(cyl(o.w * 0.5, o.w * 0.5, o.h * 0.28, o.dark || o.color, 0, -o.h * 0.5, 0, o.seg || 8));
    /* 등딱지 판 (스쿠트) */
    var n = o.scutes || 6;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      g.add(box(o.w * 0.2, 0.09, o.w * 0.2, o.dark || o.color,
        Math.cos(a) * o.w * 0.26, o.h * 0.5, Math.sin(a) * o.w * 0.26));
    }
    if (o.top) g.add(box(o.w * 0.24, 0.09, o.w * 0.24, o.dark || o.color, 0, o.h * 0.5, 0));
    return g;
  },
  /* 납작 등딱지: 마타마타·늑대거북 */
  shellFlat: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    var n = o.rows || 3;
    for (var i = 0; i < n; i++)
      for (var j = -1; j < 2; j++)
        g.add(box(o.w * 0.22, 0.1, o.d * 0.2, o.dark || o.color,
          j * o.w * 0.3, o.h / 2 + 0.04, (i - (n - 1) / 2) * o.d * 0.3));
    return g;
  },
  /* 뱀 — 다리 없이 이어지는 마디. 굵기로 종을 가른다 */
  serpent: function (o) {
    var g = new THREE.Group();
    var n = o.count || 7, segs = [];
    var p = g;
    for (var i = 0; i < n; i++) {
      var s = new THREE.Group();
      s.position.set(0, 0, i === 0 ? 0 : -o.seg);
      var k = 1 - Math.pow(i / n, 1.6) * 0.55;
      s.add(box(o.w * k, o.h * k, o.seg * 1.02, i % 2 ? (o.dark || o.color) : o.color, 0, 0, -o.seg / 2));
      if (o.tipColor && i >= n - 2)
        s.add(box(o.w * k * 1.01, o.h * k * 1.01, o.seg * 0.5, o.tipColor, 0, 0, -o.seg * 0.75));
      p.add(s); p = s; segs.push(s);
    }
    g.userData.segs = segs;
    return g;
  },
  /* 물고기 */
  fish: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    if (o.belly) g.add(box(o.w * 0.9, o.h * 0.24, o.d * 0.9, o.belly, 0, -o.h / 2 + 0.03, 0));
    return g;
  },
  /* 개구리·도롱뇽 — 앉은 자세의 납작 몸통 */
  frog: function (o) {
    var g = new THREE.Group();
    g.add(box(o.w, o.h, o.d, o.color));
    if (o.belly) g.add(box(o.w * 0.82, o.h * 0.34, 0.12, o.belly, 0, -o.h * 0.2, o.d / 2 + 0.01));
    if (o.dots) for (var i = 0; i < 5; i++)
      g.add(box(0.1, 0.05, 0.1, o.dots,

ZZL.PARTS = PARTS;

/* ============================================================
   BUILD — 조립 엔진
   spec을 받아 {root, update, react, rest, parts} 를 돌려준다.
   parts 는 퍼즐용 부위별 그룹 참조 (개별 렌더/하이라이트에 사용)
   ============================================================ */
ZZL.build = function (spec) {
  var root = new THREE.Group();
  var body = new THREE.Group();
  root.add(body);

  var parts = {};   /* 부위명 -> Group (퍼즐 단위) */
  var eyes = [];
  var anim = spec.anim || {};

  /* 몸통 */
  var b = spec.body;
  var bodyG = PARTS.body[b.type](b);
  bodyG.position.set(0, b.y, b.z || 0);
  body.add(bodyG);
  parts.body = bodyG;

  /* 목 + 머리
     머리 좌표는 몸통 공간의 절대값으로 해석한다.
     목이 있는 종만 목 끝을 기준으로 상대 배치한다. */
  var headHost = body, headBaseY = 0, headBaseZ = 0;
  if (spec.neck) {
    var n = spec.neck;
    var neckG = PARTS.neck[n.type](n);
    neckG.position.set(0, n.y, n.z);
    body.add(neckG);
    parts.neck = neckG;
    headHost = neckG; headBaseY = 0; headBaseZ = 0;
  }
  var h = spec.head;
  var headPivot = new THREE.Group();
  headPivot.position.set(0, headBaseY + h.y, headBaseZ + h.z);
  headHost.add(headPivot);
  var headG = PARTS.head[h.type](h);
  headPivot.add(headG);
  parts.head = headG;
  if (headG.userData.jaw) parts.jaw = headG.userData.jaw;

  /* 눈 */
  if (spec.eyes) {
    var e = spec.eyes;
    [1, -1].forEach(function (s) {
      var eye = pixEye(e.size, e.dark);
      eye.position.set(s * e.gap, e.y, e.z);
      if (e.side) eye.rotation.y = s * (Math.PI / 2);
      else if (e.turn) eye.rotation.y = s * e.turn;
      headG.add(eye); eyes.push(eye);
    });
  }

  /* 귀 */
  if (spec.ears) {
    var earG = PARTS.ears[spec.ears.type](spec.ears);
    earG.position.set(0, spec.ears.y, spec.ears.z || 0);
    headG.add(earG);
    parts.ears = earG;
  }

  /* 다리 */
  if (spec.legs) {
    var lg = PARTS.legs[spec.legs.type](spec.legs);
    lg.position.set(0, spec.legs.y, 0);
    body.add(lg);
    parts.legs = lg;
  }

  /* 꼬리 */
  if (spec.tail) {
    var t = spec.tail;
    var tg = PARTS.tail[t.type](t);
    tg.position.set(0, t.y, t.z);
    body.add(tg);
    parts.tail = tg;
  }

  /* 부속 */
  var extras = {};
  (spec.extras || []).forEach(function (x) {
    var g = PARTS.extra[x.type](x);
    g.position.set(x.x || 0, x.y, x.z || 0);
    var host = x.on === 'head' ? headG : (x.on === 'neck' && parts.neck ? parts.neck : body);
    host.add(g);
    extras[x.name || x.type] = g;
    if (x.puzzle !== false) parts[x.name || x.type] = g;
  });

  root.scale.setScalar(spec.scale || 1);

  /* 접지 정렬 — 조립 결과의 최저점을 y=0 에 맞춘다.
     사양에 미세한 높이 오차가 있어도 발이 뜨거나 파묻히지 않는다. */
  if (spec.groundAlign !== false) {
    root.updateMatrixWorld(true);

    if (isFinite(bb.min.y)) body.position.y -= bb.min.y / (spec.scale || 1);
  }

  /* 측정값 — 카메라 프레이밍과 퍼즐 배치에 사용 */

  var mb = new THREE.Box3().setFromObject(root);
  var msz = new THREE.Vector3(), mct = new THREE.Vector3();

  /* ── 애니메이션 ── */

  var wings = extras.wings && extras.wings.userData.wings;
  var earList = parts.ears && parts.ears.userData.ears;
  var tailSegs = parts.tail && parts.tail.userData.segs;
  var neckG2 = parts.neck;

  var bodyRestY = bodyG.position.y;

  function update(t) {
    if (root.userData.assembling) return;   /* 조립 연출 중에는 기본 모션 정지 */
    var bob = anim.bob === undefined ? 0.04 : anim.bob;
    bodyG.position.y = bodyRestY + Math.sin(t * (anim.bobSpeed || 1.6)) * bob;

    if (anim.headTurn !== false) {
      headPivot.rotation.y = Math.sin(t * (anim.turnSpeed || 0.45)) * (anim.headTurn || 0.28);
    }
    if (anim.headBob) {
      var c = (t * anim.headBob.rate) % 1;
      var k = c < 0.24 ? Math.max(0, Math.sin(c / 0.24 * Math.PI * 3)) * anim.headBob.amt : 0;
      headPivot.rotation.x = -k;
      if (extras.dewlap) extras.dewlap.scale.set(1, 1 + k * 0.4, 1 + k * 1.2);
    }
    if (anim.jerk) {   /* 앵무 특유의 끊기는 목 동작 */
      var j = (t * anim.jerk) % 1;
      headPivot.rotation.z = j < 0.13 ? 0.3 : (j < 0.26 ? -0.24 : 0);
    }
    if (neckG2 && anim.neckSway) {
      neckG2.rotation.x = Math.sin(t * 0.85) * anim.neckSway;
      neckG2.rotation.z = Math.sin(t * 0.6) * anim.neckSway * 0.8;
    }
    if (jaw && anim.jaw) {
      var jc = (t * anim.jaw) % 1;
      jaw.rotation.x = jc < 0.13 ? Math.sin(jc / 0.13 * Math.PI) * 0.36 : 0;
    }
    if (wings && anim.flap) {
      var f = ((t * anim.flap) % 1) < 0.09 ? Math.abs(Math.sin(t * 20)) * 0.5 : 0;
      wings[0].rotation.z = -0.08 - f; wings[1].rotation.z = 0.08 + f;
    }
    if (earList && anim.earTwitch) {
      var tw = ((t * 0.33) % 1) < 0.07 ? Math.sin(t * 24) * 0.26 : 0;
      earList[0].rotation.z += 0; /* 기준 회전 유지 */
      earList[0].rotation.x = tw; earList[1].rotation.x = -tw * 0.7;
    }
    if (tailSegs && anim.tailWave) {
      for (var i = 0; i < tailSegs.length; i++)
        tailSegs[i].rotation.y = Math.sin(t * 1.6 - i * 0.6) * (anim.tailWave + i * 0.02);
    }
    var bl = ((t * (anim.blink || 0.5)) % 1) < 0.05 ? 0.1 : 1;
    for (var k2 = 0; k2 < eyes.length; k2++) eyes[k2].userData.white.scale.y = bl;
  }

  function react(k) {
    root.position.y = Math.abs(Math.sin(k * Math.PI * 2)) * (anim.hop || 0.45);
    if (wings) { wings[0].rotation.z = -0.95; wings[1].rotation.z = 0.95; }
    if (jaw) jaw.rotation.x = 0.5;
  }
  function rest() { root.position.y = 0; }

  return {
    root: root, update: update, react: react, rest: rest,
    parts: parts, spec: spec,
    size: msz, center: mct, footR: Math.max(msz.x, msz.z) / 2
  };
};

/* ============================================================
   ASSEMBLY — 조립 연출
   부품이 제각각 흩어진 자리에서 튀어나왔다가(뿅) 한꺼번에
   빨려들어와 제자리에 꽂히는(척) 연출.

     var A = ZZL.assembly(model, { onLand: function(name,i){ ... } });
     A.play();
     // 프레임마다
     if (!A.done) A.update(performance.now());

   ============================================================ */
var EPS = 1e-6;

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInCubic(x) { return x * x * x; }
function easeOutBack(x, s) {          /* 지나쳤다가 되돌아오는 착지감 */
  s = s === undefined ? 1.9 : s;
  var c = s + 1, p = x - 1;
  return 1 + c * p * p * p + s * p * p;
}
function easeInBack(x, s) {           /* 반대로 살짝 물러섰다 튀어나가는 도약감 */
  s = s === undefined ? 1.5 : s;
  return (s + 1) * x * x * x - s * x * x;
}

ZZL.assembly = function (model, opts) {
  opts = opts || {};
  var order = ZZL.puzzleOrder(model.spec);
  var root = model.root;

  /* 타이밍 (ms) — 전체 약 1.9초 */
  var POP_STAGGER = opts.popStagger || 85;    /* 뿅뿅뿅 간격 — 짧게 겹쳐야 경쾌하다 */
  var POP_DUR     = opts.popDur     || 260;
  var HOLD        = opts.hold       || 230;   /* 다 튀어나온 뒤 잠깐 떠 있는 시간 */
  var FLY_STAGGER = opts.flyStagger || 55;
  var FLY_DUR     = opts.flyDur     || 620;
  var SNAP_DUR    = opts.snapDur    || 150;   /* 꽂힌 직후 눌렸다 펴지는 시간 */

  var reach = opts.reach || 0.30;             /* 흩어지는 거리 (모델 크기 배수) */
  var span = Math.max(model.size.x, model.size.y, model.size.z);

  /* 모델 중심 — 흩어짐의 기준점.
     각 부품의 제자리를 기준으로 흩뿌리면 원래 벌어진 부품일수록 더 멀리 날아가
     한쪽으로 몰린 것처럼 보인다. 중심 기준으로 잡아야 "모여든다"는 인상이 난다. */
  root.updateMatrixWorld(true);
  var bb0 = new THREE.Box3().setFromObject(root);
  var centerW = bb0.getCenter(new THREE.Vector3());

  /* 반경은 축마다 따로 잡는다. 가장 긴 축 하나로 잡으면
     악어처럼 길고 낮은 동물이 세로로 화면을 벗어난다. */
  var flat = Math.max(model.size.x, model.size.z);
  var Rx = flat * reach * 0.92;
  var Ry = model.size.y * reach;
  var Rz = model.size.z * reach * 0.7;

  /* 부품별 상태 준비 */
  var items = [];
  var names = order.filter(function (n) { return !!model.parts[n]; });
  var N = names.length;

  names.forEach(function (name, i) {

      pos: g.position.clone(),

    };

    /* 방향을 고르게 분배한다 (황금각). 무작위로 뽑으면 한쪽에 뭉친다. */
    var y = 1 - 2 * ((i + 0.5) / N);

    var startW = centerW.clone().add(new THREE.Vector3(
      Math.cos(a) * rr * Rx * jit,
      y * Ry * jit,
      Math.sin(a) * rr * Rz * jit
    ));
    var from = g.parent.worldToLocal(startW.clone());

    var axis = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
    var spin = new THREE.Quaternion().setFromAxisAngle(axis, (Math.random() * 1.4 + 0.7) * (Math.random() < 0.5 ? -1 : 1));
    var away = home.quat.clone().multiply(spin);

    items.push({

      popAt: i * POP_STAGGER, flyAt: 0, landed: false,
      wob: Math.random() * Math.PI * 2
    });

  var popEnd = (items.length ? (items.length - 1) * POP_STAGGER : 0) + POP_DUR;
  var flyBase = popEnd + HOLD;
  /* 얕은 부품(몸통 쪽)부터 합체 */

  /* ── 완성 임팩트 ─────────────────────────────
     ① 실루엣이 하얗게 번쩍  ② 빛무리가 퍼짐  ③ 충격파 고리
     ④ 불꽃이 사방으로  ⑤ 몸이 부풀었다 되돌아옴 */
  var FIN_DUR = opts.finaleDur || 820;
  var total = lastLand + FIN_DUR;
  var baseScale = model.spec.scale || 1;

  var flashMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
  var shots = [];
  root.traverse(function (o) { if (o.isMesh) shots.push({ m: o, orig: o.material }); });

  var fx = new THREE.Group();
  fx.visible = false;
  root.add(fx);
  var fxCenter = root.worldToLocal(centerW.clone());

  /* 빛무리 */
  var halo = null;
  try {
    var hc = document.createElement('canvas');
    hc.width = hc.height = 128;
    var hx = hc.getContext('2d');
    var grd = hx.createRadialGradient(64, 64, 4, 64, 64, 64);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.35, 'rgba(255,242,196,0.72)');
    grd.addColorStop(1, 'rgba(255,220,150,0)');
    hx.fillStyle = grd; hx.fillRect(0, 0, 128, 128);
    halo = new THREE.Mesh(
      new THREE.PlaneGeometry(span * 2.8, span * 2.8),
      new THREE.MeshBasicMaterial({

        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide

    fx.add(halo);

  /* 충격파 고리 2겹 */
  var rings = [];
  [[0xFFF0BE, 0.05, 0.06], [0xFFFFFF, 0.028, null]].forEach(function (q, i) {
    var rm = new THREE.MeshBasicMaterial({
      color: q[0], transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    var rg = new THREE.Mesh(new THREE.TorusGeometry(span * 0.5, span * q[1], 6, 32), rm);
    rg.rotation.x = Math.PI / 2;
    rg.position.set(0, q[2] === null ? fxCenter.y : q[2], 0);
    fx.add(rg); rings.push(rg);
  });

  /* 불꽃 */
  var sparkMat = new THREE.MeshBasicMaterial({
    color: 0xFFE9A8, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  var sparks = [], SPARK_N = 16;
  for (var si = 0; si < SPARK_N; si++) {
    var sp = new THREE.Mesh(new THREE.BoxGeometry(span * 0.06, span * 0.06, span * 0.06), sparkMat);
    var sa = (si / SPARK_N) * Math.PI * 2;
    sp.userData.dir = new THREE.Vector3(
      Math.cos(sa), (si % 3 - 1) * 0.55, Math.sin(sa) * 0.6).normalize();
    fx.add(sp); sparks.push(sp);

  }
  function clearFx() {
    fx.visible = false;
    setFlash(false);
    if (halo) halo.material.opacity = 0;
    rings.forEach(function (r) { r.material.opacity = 0; });
    sparkMat.opacity = 0;
    root.scale.setScalar(baseScale);
  }

  var t0 = 0, running = false;
  var api = { done: true, duration: total };

  api.play = function () {
    t0 = performance.now();
    running = true; api.done = false;
    root.userData.assembling = true;
    clearFx();
    items.forEach(function (it) {
      it.landed = false;
      it.g.visible = false;
      it.g.scale.set(EPS, EPS, EPS);
    });
    /* 첫 프레임 잔상 방지 */
    api.update(t0);
  };

  api.stop = function () {   /* 즉시 완성 상태로 */
    running = false; api.done = true;
    root.userData.assembling = false;
    clearFx();
    items.forEach(function (it) {
      it.g.visible = true;
      it.g.position.copy(it.home.pos);
      it.g.quaternion.copy(it.home.quat);
      it.g.scale.copy(it.home.scl);
    });
  };

  api.update = function (now) {
    if (!running) return;
    var e = now - t0;

    for (var i = 0; i < items.length; i++) {
      var it = items[i], g = it.g;

      /* ① 아직 등장 전 */
      if (e < it.popAt) { g.visible = false; continue; }
      g.visible = true;

      /* ② 뿅 — 중심 주위의 제 자리에서 튀어나옴 */
      if (e < it.popAt + POP_DUR) {
        var p = (e - it.popAt) / POP_DUR;
        var s = easeOutBack(p, 2.6);
        g.position.copy(it.from);
        g.quaternion.copy(it.away);
        g.scale.set(it.home.scl.x * s, it.home.scl.y * s, it.home.scl.z * s);
        continue;
      }

      /* ③ 대기 — 제자리에서 살짝 흔들리며 떠 있음 */
      if (e < it.flyAt) {
        var w = (e * 0.006) + it.wob;
        g.position.copy(it.from);
        g.position.y += Math.sin(w) * span * 0.018;
        g.quaternion.copy(it.away);
        g.scale.copy(it.home.scl);
        continue;
      }

      /* ④ 합체 — 살짝 물러섰다가 중심으로 빨려들어옴 */
      if (e < it.flyAt + FLY_DUR) {
        var f = (e - it.flyAt) / FLY_DUR;
        var k = f < 0.25
          ? -easeInBack(f / 0.25, 1.6) * 0.16
          : easeOutBack((f - 0.25) / 0.75, 1.5);
        g.position.lerpVectors(it.from, it.home.pos, k);
        g.quaternion.copy(it.away);
        if (f >= 0.25) g.quaternion.slerp(it.home.quat, easeOutCubic((f - 0.25) / 0.75));
        var st = 1 + Math.sin(Math.min(f / 0.25, 1) * Math.PI) * 0.1;
        g.scale.set(it.home.scl.x / st, it.home.scl.y * st, it.home.scl.z / st);
        continue;
      }

      /* ⑤ 착지 — 눌렸다 펴짐 */
      if (!it.landed) {
        it.landed = true;
        if (opts.onLand) opts.onLand(it.name, i);
      }
      var q = Math.min((e - it.flyAt - FLY_DUR) / SNAP_DUR, 1);
      var sq = 1 - Math.sin(q * Math.PI) * 0.14;
      g.position.copy(it.home.pos);
      g.quaternion.copy(it.home.quat);
      g.scale.set(it.home.scl.x / sq, it.home.scl.y * sq, it.home.scl.z / sq);
    }

    /* ⑥ 완성 임팩트 */
    if (e >= lastLand) {
      var fe = e - lastLand, u = Math.min(fe / FIN_DUR, 1);
      fx.visible = true;

      /* 하얀 섬광 — 아주 짧게, 대신 강하게 */
      setFlash(fe < 110);

      /* 빛무리: 확 커졌다 사라짐 */
      if (halo) {
        halo.material.opacity = Math.max(0, 1 - u) * (fe < 60 ? fe / 60 : 1) * 0.95;
        var hs = 0.35 + easeOutCubic(u) * 1.25;
        halo.scale.set(hs, hs, hs);
      }

      /* 충격파 고리: 시차를 두고 두 겹 */
      rings.forEach(function (rg, i) {
        var d = i * 0.14;
        var v = Math.min(Math.max((u - d) / (1 - d), 0), 1);
        var rs = 0.35 + easeOutCubic(v) * 2.5;
        rg.scale.set(rs, rs, 1);
        rg.material.opacity = (1 - v) * (1 - v) * 0.95;
      });

      /* 불꽃: 바깥으로 튀며 작아짐 */
      var sv = Math.min(u / 0.72, 1);
      sparkMat.opacity = (1 - sv) * 0.95;
      for (var k2 = 0; k2 < sparks.length; k2++) {
        var d2 = span * (0.25 + easeOutCubic(sv) * 1.15);
        sparks[k2].position.copy(fxCenter).addScaledVector(sparks[k2].userData.dir, d2);
        var ss = Math.max(0.05, 1 - sv);
        sparks[k2].scale.set(ss, ss, ss);
      }

      /* 몸이 부풀었다 되돌아옴 */
      var pop2 = fe < 320 ? Math.sin((fe / 320) * Math.PI) * 0.16 : 0;
      root.scale.setScalar(baseScale * (1 + pop2));
    }

    if (e >= total) {
      running = false; api.done = true;
      root.userData.assembling = false;
      items.forEach(function (it) {
        it.g.visible = true;
        it.g.position.copy(it.home.pos);
        it.g.quaternion.copy(it.home.quat);
        it.g.scale.copy(it.home.scl);
      });
      clearFx();
      if (opts.onComplete) opts.onComplete();
    }
  };

  return api;
};

    scale: p.scale || 1.0,
    body: { type: 'serpent', w: th, h: th * 0.8, seg: seg, count: frontN,
            y: y, z: 0, color: c, dark: d, tipColor: null },
    head: { type: 'snake', w: th * 1.05, h: th * 0.66, d: 0.5 * k,
            color: p.headC || c, dark: d, y: y, z: 0.3 * k, tongue: 0xD8506A },

    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { useLS = false; }
  }
  function code() {
    var C = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 4; i++) s += C[Math.floor(Math.random() * C.length)];
    return 'ZZL-' + s;
  }
  return {
    persistent: function () { return useLS; },
    get: read,
    has: function (id) { return !!read().got[id]; },
    count: function () { return Object.keys(read().got).length; },
    add: function (id, grade) {
      var d = read();
      if (!d.got[id]) d.got[id] = { at: Date.now(), grade: grade, seen: 1 };
      else d.got[id].seen++;
      if (!d.code) d.code = code();
      write();
      return d.got[id];
    },
    reset: function () { mem = blank(); write(); },
    set: function (k, v) { read()[k] = v; write(); }
  };
})();

/* ══ 음향 ══════════════════════════════════════
   외부 음원 없이 Web Audio로 합성한다 (저작권·용량 문제 없음).
   규칙 9-A: 소리를 꺼도 게임은 완전히 동작한다.
   규칙 9-B: 동물 울음소리는 쓰지 않는다. */
ZDX.sound = (function () {
  var ctx = null, master = null, bgGain = null, bgTimer = null;

  function ac() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
      bgGain = ctx.createGain(); bgGain.gain.value = 0.0; bgGain.connect(master);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type, vol, at, slide) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (at || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, at, hp) {
    var c = ac(); if (!c) return;
    var t = c.currentTime + (at || 0);
    var n = Math.floor(c.sampleRate * dur);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
    var g = c.createGain(); g.gain.value = vol || 0.12;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t);
  }

  var on = function () { return ZDX.save.get().sfx; };

  var SFX = {
    /* 1 구역 진입 */
    zone: function () { tone(523, .12, 'sine', .18); tone(784, .22, 'sine', .16, .1); },
    /* 2 조각 정답 — 딸깍 */
    snap: function () { noise(.05, .1, 0, 2600); tone(880, .07, 'square', .1); },
    /* 3 조각 오답 — 중립적인 튕김 (규칙 9-C) */
    miss: function () { tone(320, .12, 'sine', .12, 0, 250); },
    /* 4 조립 완성 */
    build: function () {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, .18, 'triangle', .16, i * .06); });
    },
    /* 5 채색 전환 */
    paint: function () { noise(.3, .07, 0, 900); tone(1200, .3, 'sine', .08, 0, 2400); },
    /* 6 도감 등록 — 도장 */
    stamp: function () { tone(180, .18, 'sine', .3, 0, 90); noise(.09, .14, 0, 700); },
    /* 7 변종·희귀 */
    rare: function () {
      [784, 988, 1175, 1568].forEach(function (f, i) { tone(f, .3, 'sine', .14, i * .08); });
    },
    /* 8 전 종 완주 */
    fanfare: function () {
      [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) {
        tone(f, .32, 'triangle', .18, i * .13);
      });
    },
    /* 동물 등장 */
    pop: function () { tone(660, .1, 'sine', .14, 0, 990); }
  };

  var api = {};
  Object.keys(SFX).forEach(function (k) {
    api[k] = function () { if (on()) try { SFX[k](); } catch (e) {} };
  });

  /* 배경음 — 잔잔한 아르페지오. 기본 꺼짐, 켜도 낮은 볼륨 */
  var SCALE = [392, 440, 523, 587, 659, 784];
  api.bgm = function (want) {
    var c = ac(); if (!c) return;
    if (want) {
      bgGain.gain.setTargetAtTime(0.22, c.currentTime, .4);
      if (bgTimer) return;
      var i = 0;
      bgTimer = setInterval(function () {
        if (!ZDX.save.get().bgm) return;
        var f = SCALE[(i * 3 + Math.floor(i / 6)) % SCALE.length];
        var t = c.currentTime;
        var o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f * (i % 12 < 6 ? 1 : 0.5);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(.09, t + .3);
        g.gain.exponentialRampToValueAtTime(.0001, t + 1.6);
        o.connect(g); g.connect(bgGain);
        o.start(t); o.stop(t + 1.7);
        i++;
      }, 720);
    } else {
      bgGain.gain.setTargetAtTime(0, c.currentTime, .3);
    }
  };
  api.unlock = function () { ac(); };
  return api;
})();

/* ══ 썸네일 ════════════════════════════════════
   도감 목록과 퍼즐 조각은 2D 이미지로 쓴다 (기획 10장 저사양 대응).
   3D 모델을 오프스크린에서 한 번 렌더해 dataURL로 캐시. */
ZDX.thumbs = (function () {
  var R = null, scene = null, cam = null, cache = {};

  function init() {
    if (R) return;
    var cv = document.createElement('canvas');
    cv.width = cv.height = 220;
    R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    R.setPixelRatio(1);
    if (THREE.sRGBEncoding) R.outputEncoding = THREE.sRGBEncoding;
    scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xEAF4F8, 0x8E8560, 1.0));
    var k = new THREE.DirectionalLight(0xFFF8E8, 1.0); k.position.set(4, 7, 6); scene.add(k);
    var r2 = new THREE.DirectionalLight(0xC6DCFF, .35); r2.position.set(-4, 2, -3); scene.add(r2);
    cam = new THREE.PerspectiveCamera(32, 1, .1, 200);
  }

  function frame(obj, turn) {
    var b = new THREE.Box3().setFromObject(obj);
    var s = new THREE.Vector3(), c = new THREE.Vector3();
    b.getSize(s); b.getCenter(c);
    var m = Math.max(s.x, s.y, s.z) * 1.25;
    var d = (m / 2) / Math.tan(cam.fov * Math.PI / 360);
    var a = turn === undefined ? -0.6 : turn;
    cam.position.set(c.x + Math.sin(a) * d, c.y + m * 0.22, c.z + Math.cos(a) * d);
    cam.lookAt(c);
  }

  return {
    /* 종 전체 썸네일. silhouette=true 면 단색 실루엣 */
    species: function (spec, silhouette) {
      init();
      var key = spec.id + (silhouette ? ':sil' : ':full');
      if (cache[key]) return cache[key];
      var m = ZZL.build(spec.model);
      var swap = [];
      if (silhouette) {
        var sm = new THREE.MeshBasicMaterial({ color: 0xB9B3A2 });
        m.root.traverse(function (o) { if (o.isMesh) { swap.push([o, o.material]); o.material = sm; } });
      }
      scene.add(m.root);
      frame(m.root);
      R.render(scene, cam);
      var url = R.domElement.toDataURL('image/png');
      scene.remove(m.root);
      swap.forEach(function (q) { q[0].material = q[1]; });
      cache[key] = url;
      return url;
    },
    /* 부위 하나만 떼어 렌더 — 퍼즐 선택지 */
    part: function (spec, partName) {
      init();
      var key = spec.id + ':p:' + partName;
      if (cache[key]) return cache[key];
      var m = ZZL.build(spec.model);
      var g = m.parts[partName];
      if (!g) return null;
      var parent = g.parent;
      scene.add(g);                 /* 잠시 떼어내 단독 렌더 */
      g.position.set(0, 0, 0);
      g.quaternion.identity();
      frame(g, -0.5);
      R.render(scene, cam);
      var url = R.domElement.toDataURL('image/png');
      scene.remove(g);
      parent.add(g);
      cache[key] = url;
      return url;
    }
  };
})();

/* ══ 조우 로직 ═════════════════════════════════ */
ZDX.encounter = (function () {
  var lastAt = {};    /* 구역별 다음 출현 가능 시각 */
  var pending = {};   /* 구역별 남은 대기(ms) — 이탈 시 보존, 규칙 C-3 */

  return {
    /* 구역의 미수집 종 중 하나를 가중치로 뽑는다 (규칙 C-4)
       개체수가 많고 찾기 쉬운 종이 먼저 나온다 */
    pick: function (zone, list) {
      var pool = list.filter(function (s) {
        return s.zone === zone && !ZDX.save.has(s.id);
      });
      if (!pool.length) return null;
      var tot = 0;
      pool.forEach(function (s) { s._w = Math.log(1 + (s.n || 1)) + 0.4; tot += s._w; });
      var r = Math.random() * tot;
      for (var i = 0; i < pool.length; i++) { r -= pool[i]._w; if (r <= 0) return pool[i]; }
      return pool[pool.length - 1];
    },
    gap: function (zone) {
      var z = ZDX.zones.filter(function (x) { return x.name === zone; })[0];
      return z ? z.gap * 1000 : 0;
    },
    ready: function (zone) {
      return !lastAt[zone] || Date.now() >= lastAt[zone];
    },
    remain: function (zone) {
      return Math.max(0, (lastAt[zone] || 0) - Date.now());
    },
    arm: function (zone) {
      var g = this.gap(zone);
      if (g > 0) lastAt[zone] = Date.now() + g;
    },
    reset: function () { lastAt = {}; pending = {}; }
  };
})();

/* ══ 퍼즐 ══════════════════════════════════════
   규칙 4-A: 오답 조각은 같은 구역 근연종의 실제 부품을 쓴다.
   무작위·엉터리 조각을 오답으로 쓰지 않는다. */
ZDX.puzzle = {
  /* 같은 자리에 붙는 부품끼리는 서로 오답이 될 수 있다.
     꽃사슴의 가지뿔 문제라면 무플론의 나선뿔·흑염소의 뒤로 굽은 뿔이 오답이 된다.
     "머리에 무엇이 달렸는가"를 묻게 되므로 오히려 관찰 유도에 맞다. */
  SLOT: {
    antler: 'headgear', horn: 'headgear', crest: 'headgear', beard: 'headgear',
    quills: 'attach', patagium: 'attach', fins: 'attach', dewlap: 'attach'
  },
  slotOf: function (p) { return this.SLOT[p] || p; },

  /* 어떤 종이 주어진 슬롯에서 내놓을 수 있는 부품 이름 */
  partFor: function (spec, slot) {
    var self = this;
    var order = ZZL.puzzleOrder(spec.model);
    for (var i = 0; i < order.length; i++) {
      if (self.slotOf(order[i]) === slot) return order[i];
    }
    return null;
  },

  make: function (spec, all, parts) {
    var self = this;
    var order = ZZL.puzzleOrder(spec.model).slice(0, parts || 99);
    var rivals = (spec.rivals || []).map(function (n) {
      return all.filter(function (s) { return s.kname === n; })[0];
    }).filter(Boolean);
    /* 근연종이 부족하면 같은 구역의 다른 종으로 보충 */
    all.forEach(function (s) {
      if (rivals.length >= 4) return;
      if (s.id !== spec.id && s.zone === spec.zone && rivals.indexOf(s) < 0) rivals.push(s);
    });

    return order.map(function (p) {
      var slot = self.slotOf(p);
      var wrong = [];
      function tryAdd(s) {
        if (wrong.length >= 2) return;
        if (s.id === spec.id) return;
        if (wrong.some(function (w) { return w.spec.id === s.id; })) return;
        var part = self.partFor(s, slot);
        if (part) wrong.push({ spec: s, part: part });
      }
      rivals.forEach(tryAdd);                                  /* ① 근연종 우선 */
      all.forEach(function (s) { if (s.zone === spec.zone) tryAdd(s); });  /* ② 같은 구역 */
      all.forEach(tryAdd);                                     /* ③ 그래도 모자라면 전체 */

      var opts = [{ spec: spec, part: p, ok: true }]
        .concat(wrong.map(function (w) { return { spec: w.spec, part: w.part, ok: false }; }));
      for (var j = opts.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var t = opts[j]; opts[j] = opts[k]; opts[k] = t;
      }
      return { part: p, slot: slot, options: opts };
    });
  },
  grade: function (misses, reduced) {
    if (reduced || misses >= 3) return '브론즈';
    if (misses === 0) return '골드';
    return '실버';
  }
};

global.ZDX = ZDX;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
'use strict';
var SP=window.ZZL_SPECIES, S=ZDX.save, SND=ZDX.sound;
var $=function(id){return document.getElementById(id);};

/* ── 3D 무대 (모달 공용) ── */
var cv=document.createElement('canvas');
var R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var sc=new THREE.Scene();
var cam=new THREE.PerspectiveCamera(34,1,.1,120);
sc.add(new THREE.HemisphereLight(0xE8F2F6,0x8E8560,.95));
var kl=new THREE.DirectionalLight(0xFFF8E8,1.02); kl.position.set(5,9,6); sc.add(kl);
var rl=new THREE.DirectionalLight(0xC6DCFF,.36); rl.position.set(-5,3,-4); sc.add(rl);
var pod=new THREE.Group();
pod.add(new THREE.Mesh(new THREE.CylinderGeometry(3.05,3.25,.34,26),
  new THREE.MeshStandardMaterial({color:0xC9CBA8,roughness:.94,flatShading:true})));
pod.children[0].position.y=-.17;
sc.add(pod);
var cur=null, curA=null, rotY=-.55, rotT=-.55, vel=0, drag=false, lastX=0, idle=0;

function show3D(spec){
  if(cur){ sc.remove(cur.root); }
  cur=ZZL.build(spec.model); sc.add(cur.root);
  curA=ZZL.assembly(cur,{
    onLand:function(){ SND.snap(); },
    onComplete:function(){ var f=$('flash'); if(f){f.classList.remove('on');void f.offsetWidth;f.classList.add('on');} SND.build(); }
  });
  rotY=rotT=-.55; vel=0;
  var R0=Math.max(cur.footR*1.45,1.2);
  pod.scale.setScalar(R0/3.05);

  return cur;
}
function fit(){
  if(!cur)return;
  var w=cv.clientWidth||300,h=cv.clientHeight||240;
  R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  var hh=cur.size.y*1.5, ww=Math.max(cur.size.x*1.2,(cur.footR*1.45)*2.1);
  var vF=cam.fov*Math.PI/180, hF=2*Math.atan(Math.tan(vF/2)*cam.aspect);
  var d=Math.max((hh/2)/Math.tan(vF/2),(ww/2)/Math.tan(hF/2));

cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);drag=true;lastX=e.clientX;vel=0;});
cv.addEventListener('pointermove',function(e){if(!drag)return;var d=e.clientX-lastX;lastX=e.clientX;rotT+=d*.011;vel=d*.011;idle=performance.now();});
cv.addEventListener('pointerup',function(){drag=false;idle=performance.now();});
var clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);

  var t=clock.getElapsedTime(), now=performance.now();
  if(!drag){rotT+=vel;vel*=.93;if(now-idle>2600)rotT+=.0032;}
  rotY+=(rotT-rotY)*.16;

})();

/* ── 지도 ── */
var Z=ZDX.zones;
var lo0=Math.min.apply(null,Z.map(function(z){return z.lon;}));
var lo1=Math.max.apply(null,Z.map(function(z){return z.lon;}));
var la0=Math.min.apply(null,Z.map(function(z){return z.lat;}));
var la1=Math.max.apply(null,Z.map(function(z){return z.lat;}));
var PAD=42, W=300, H=306;
/* 부지는 약 75m x 198m로 세로가 길다.
   가로·세로를 각각 늘리면 실제 배치가 왜곡되므로 등방(等方) 투영을 쓴다. */
var mW=ZDX.dist(lo0,la0,lo1,la0), mH=ZDX.dist(lo0,la0,lo0,la1);
var scale=Math.min((W-PAD*2)/mW,(H-PAD*2)/mH);      /* px per meter */
var offX=(W-mW*scale)/2, offY=(H-mH*scale)/2;
function px(lon){ return offX+ZDX.dist(lo0,la0,lon,la0)*scale; }
function py(lat){ return H-offY-ZDX.dist(lo0,la0,lo0,lat)*scale; }
var Rpx=ZDX.RADIUS*scale;

var me={lon:null,lat:null}, inZones=[], watchId=null;

function zoneSpecies(name){ return SP.filter(function(s){return s.zone===name;}); }
function zoneLeft(name){ return zoneSpecies(name).filter(function(s){return !S.has(s.id);}).length; }

function drawMap(){
  var svg=$('map'), out='';
  Z.forEach(function(z){
    var x=px(z.lon), y=py(z.lat), inz=inZones.indexOf(z.name)>=0;
    var left=zoneLeft(z.name), tot=zoneSpecies(z.name).length;
    out+='<circle class="zoneC'+(inz?' in':'')+'" cx="'+x+'" cy="'+y+'" r="'+Rpx.toFixed(1)+'"/>';
    out+='<circle class="zoneDot'+(inz?' in':'')+'" cx="'+x+'" cy="'+y+'" r="3"/>';
    out+='<text class="zoneT'+(inz?' in':'')+'" x="'+x+'" y="'+(y-8)+'" text-anchor="middle">'+z.name+'</text>';
    out+='<text class="zoneN" x="'+x+'" y="'+(y+15)+'" text-anchor="middle">'+(tot-left)+'/'+tot+'</text>';
  });
  if(me.lon!==null){
    var mx=px(me.lon), my=py(me.lat);
    out+='<circle class="meR" cx="'+mx+'" cy="'+my+'" r="'+(Rpx*0.5).toFixed(1)+'"/>';
    out+='<circle class="me" cx="'+mx+'" cy="'+my+'" r="5"/>';
  }
  svg.innerHTML=out;
}

function recompute(){
  var was=inZones.slice();
  inZones=[];
  if(me.lon!==null){
    Z.forEach(function(z){
      if(ZDX.dist(me.lon,me.lat,z.lon,z.lat)<=ZDX.RADIUS) inZones.push(z.name);
    });
  }
  inZones.forEach(function(n){
    if(was.indexOf(n)<0){ SND.zone(); toast(n+'에 도착했어요'); }
  });
  drawMap(); drawZoneList();
  tryEncounter();
}

function setMe(lon,lat){ me.lon=lon; me.lat=lat; recompute(); }

/* ── 구역 목록 (GPS 없이도 테스트 가능) ── */
function drawZoneList(){
  var el=$('zlist'); el.innerHTML='';
  Z.forEach(function(z){
    var b=document.createElement('button');
    var left=zoneLeft(z.name);
    b.className=(inZones.indexOf(z.name)>=0?'here ':'')+(left===0?'done':'');
    b.innerHTML=z.name+'<i>'+left+'</i>';
    b.onclick=function(){ SND.unlock(); setMe(z.lon,z.lat); };
    el.appendChild(b);
  });
}

/* ── GPS ── */
$('gbtn').onclick=function(){

    setMe(p.coords.longitude,p.coords.latitude);
  },function(){
    $('gtxt').textContent='위치를 가져오지 못했어요. 아래에서 구역을 골라 체험해보세요.';
  },{enableHighAccuracy:true,maximumAge:3000,timeout:12000});
};

/* ── 조우 ── */
var busy=false, timers={};
function tryEncounter(){
  if(busy||!inZones.length)return;
  for(var i=0;i<inZones.length;i++){
    var zn=inZones[i];
    if(!ZDX.encounter.ready(zn))continue;
    var pick=ZDX.encounter.pick(zn,SP);
    if(!pick)continue;
    ZDX.encounter.arm(zn);
    openEncounter(pick);
    return;
  }
}
setInterval(function(){ if(!busy) tryEncounter(); },2000);

/* ── 화면 ── */
function toast(m){
  var t=$('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(timers.t); timers.t=setTimeout(function(){t.classList.remove('on');},2300);
}
function closeModal(){ $('modal').hidden=true; $('sheet').innerHTML=''; busy=false; drawAll(); }
function openSheet(html){ $('sheet').innerHTML=html; $('modal').hidden=false; }

/* 조우 → 퍼즐 */
function openEncounter(spec){
  busy=true;
  SND.pop();
  var steps=ZDX.puzzle.make(spec,SP);
  var step=0, misses=0, reduced=false;
  var sil=ZDX.thumbs.species(spec,true);

  function render(){
    var st=steps[step];
    var html=''
     +'<div class="stage"><div class="stag">'+spec.zone+'</div>'
     +'<div class="sil"><img src="'+sil+'"></div></div>'
     +'<div class="qhead"><b>'+(step===0?'동물이 나타났어요!':'좋아요, 계속!')+'</b>'
     +'<span>'+(step+1)+' / '+steps.length+'</span></div>'
     +'<div class="qtip">눈앞의 동물을 보고 <b>'+PARTKO(st.part)+'</b> 조각을 골라주세요.</div>'
     +'<div class="opts" id="opts"></div>'
     +'<div class="qbar"><button class="x" id="qx">나중에</button>'
     +'<button class="e" id="qe">'+(reduced?'조각을 줄였어요':'조각 줄이기')+'</button></div>';
    openSheet(html);
    var wrap=$('opts');
    st.options.forEach(function(o,i){
      var b=document.createElement('button');
      b.className='opt';
      var img=document.createElement('img');
      img.src=ZDX.thumbs.part(o.spec,o.part)||sil;
      b.appendChild(img);
      b.onclick=function(){
        if(o.ok){
          b.classList.add('yes'); SND.snap();
          step++;
          if(step>=steps.length) setTimeout(finish,260);
          else setTimeout(render,260);
        }else{
          misses++; SND.miss();
          b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
          if(misses===2) toast('힌트: 실루엣을 다시 보세요');
          if(misses>=3) toast(spec.zone+'의 안내판을 확인해보세요');
        }
      };
      wrap.appendChild(b);
    });
    $('qx').onclick=function(){ closeModal(); };
    $('qe').onclick=function(){
      if(reduced)return;
      reduced=true;
      steps=steps.slice(0,Math.max(3,steps.length-2));
      if(step>=steps.length) step=steps.length-1;
      render();
    };
  }

  function finish(){
    var grade=ZDX.puzzle.grade(misses,reduced);
    S.add(spec.id,grade);
    SND.paint(); setTimeout(function(){SND.stamp();},420);
    if(S.count()===SP.length) setTimeout(function(){SND.fanfare();},900);
    openCard(spec,true,grade);
  }
  render();
}

var PARTKO_MAP={head:'머리',body:'몸통',legs:'다리',tail:'꼬리',ears:'귀',neck:'목',
  wings:'날개',jaw:'아래턱',horn:'뿔',antler:'뿔',crest:'볏',beard:'턱수염',
  quills:'등가시',patagium:'비막',fins:'지느러미',dewlap:'목주름'};
function PARTKO(p){ return PARTKO_MAP[p]||p; }

/* 카드 상세 */
function openCard(spec,fresh,grade){
  busy=true;
  var got=S.get().got[spec.id];
  var g=grade||(got&&got.grade)||'';
  openSheet(''
   +'<div class="stage" id="stg"><div class="stag">'+spec.id+'</div><div class="flash" id="flash"></div></div>'
   +'<div class="body">'
   +'<div class="nameline"><span class="kname">'+spec.kname+'</span>'
   +'<span class="ename">'+spec.ename.toUpperCase()+'</span></div>'
   +'<div class="meta"><span class="chip z">'+spec.zone+'</span>'
   +'<span class="chip">'+spec.n+'마리</span>'
   +(g?'<span class="chip g">'+g+'</span>':'')+'</div>'
   +'<dl class="rows">'
   +'<div class="row"><dt>관찰 포인트</dt><dd>'+spec.tell+'</dd></div>'
   +'<div class="row"><dt>헷갈리는 친구</dt><dd>'+((spec.rivals||[]).join(' · ')||'없음')+'</dd></div>'
   +'<div class="row"><dt>생태</dt><dd class="pend">출처 확인 후 공개됩니다</dd></div>'
   +'<div class="row"><dt>보전 등급</dt><dd class="pend">출처 확인 후 공개됩니다</dd></div>'
   +'</dl></div>'
   +'<div class="src">생태·보전 항목은 1차 출처 확인 전이라 비워둡니다.<br>'
   +'관찰 포인트는 형태 관찰 기준이며 사육사 감수 예정입니다.</div>'
   +'<div class="foot"><button class="go" id="ok">'+(fresh?'도감에 넣기':'닫기')+'</button></div>');
  $('stg').appendChild(cv);
  var m=show3D(spec);
  setTimeout(fit,0);
  if(fresh){ curA.play(); }
  $('ok').onclick=function(){
    if(fresh) toast(spec.kname+' 등록! '+S.count()+' / '+SP.length);
    closeModal();
  };
}

/* ── 도감 ── */
function drawGrid(){
  var el=$('grid'); el.innerHTML='';
  SP.forEach(function(s){
    var has=S.has(s.id);
    var b=document.createElement('button');
    b.className='cell'+(has?'':' locked');
    var img=document.createElement('img');
    img.loading='lazy';
    b.appendChild(img);
    var nm=document.createElement('b'); nm.textContent=has?s.kname:'???';
    b.appendChild(nm);
    var no=document.createElement('u'); no.textContent=s.id.slice(1); b.appendChild(no);
    if(has){
      var gd=document.createElement('span');
      gd.className='gr '+(S.get().got[s.id].grade||'브론즈'); b.appendChild(gd);
    }
    /* 썸네일은 화면에 들어올 때 생성 (62종 한꺼번에 렌더하지 않는다) */
    var io=new IntersectionObserver(function(en){
      if(en[0].isIntersecting){
        img.src=ZDX.thumbs.species(s,!has);
        io.disconnect();
      }
    },{rootMargin:'120px'});
    io.observe(b);
    b.onclick=function(){
      if(has) openCard(s,false);
      else toast(s.zone+'에 가면 만날 수 있어요');
    };
    el.appendChild(b);
  });
}

function drawAll(){
  var n=S.count();
  $('prog').textContent=n+' / '+SP.length;
  $('dexN').textContent=n+'종 수집';
  $('dexS').textContent=Math.round(n/SP.length*100)+'%';
  $('dexBar').style.width=(n/SP.length*100)+'%';
  drawMap(); drawZoneList();
  var code=S.get().code;
  $('note1').innerHTML='ZZL FIELD GUIDE · '+SP.length+'종'+(code?' · 내 도감 '+code:'');
  $('note2').innerHTML=S.persistent()
    ? '진행은 이 브라우저에 저장됩니다'+(code?' · 복구 코드 '+code:'')
    : '※ 이 미리보기에서는 저장이 되지 않습니다';
}

/* ── 탭·설정 ── */
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return;
  var v=+b.dataset.v;
  Array.prototype.forEach.call(this.children,function(x){
    x.setAttribute('aria-pressed',String(+x.dataset.v===v));});
  $('paneMap').hidden=v!==0; $('paneDex').hidden=v!==1;
  SND.unlock();
  if(v===1) drawGrid();
});
$('bSfx').onclick=function(){
  var v=!S.get().sfx; S.set('sfx',v);
  this.setAttribute('aria-pressed',String(v));
  SND.unlock(); if(v) SND.zone();
};
$('bBgm').onclick=function(){
  var v=!S.get().bgm; S.set('bgm',v);
  this.setAttribute('aria-pressed',String(v));
  SND.unlock(); SND.bgm(v);
};
$('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

$('bSfx').setAttribute('aria-pressed',String(S.get().sfx));
$('bBgm').setAttribute('aria-pressed',String(S.get().bgm));
drawAll(); drawGrid();
})();
</script>
</body>
</html>
